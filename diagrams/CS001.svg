<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Principia Mathematica: arithmetic from logic</title><desc>A four-layer stack from logical axioms up to arithmetic, with the type theory layer blocking the paradox.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="25" y="160" width="250" height="36" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="150" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Axioms of logic + rules of inference</text><rect x="45" y="118" width="210" height="36" rx="6" fill="#8e6bbf" fill-opacity="0.16" stroke="#8e6bbf" stroke-width="1.5"/><text x="150" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Theory of types (blocks the paradox)</text><rect x="65" y="76" width="170" height="36" rx="6" fill="#8e6bbf" fill-opacity="0.22" stroke="#8e6bbf" stroke-width="1.5"/><text x="150" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Classes and numbers</text><rect x="85" y="34" width="130" height="36" rx="6" fill="#8e6bbf" fill-opacity="0.28" stroke="#8e6bbf" stroke-width="1.5"/><text x="150" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Arithmetic, analysis</text><line x1="18" y1="190" x2="18" y2="40" stroke="#8e6bbf" stroke-width="2" marker-end="url(#a)"/><text x="18" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">derive</text><text x="335" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#8e6bbf">1 + 1 = 2</text><text x="335" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">is proved hundreds</text><text x="335" y="108.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">of pages in</text><text x="335" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">every step written</text><text x="335" y="164.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">out, checked by rule</text></svg>

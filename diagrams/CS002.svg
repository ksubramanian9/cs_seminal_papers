<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Gödel’s incompleteness argument</title><desc>A self-referential sentence encoded by a Gödel number leads to a true but unprovable statement.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="15" y="18" width="175" height="66" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="102" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#8e6bbf">G</text><text x="102" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">“The formula numbered n</text><text x="102" y="68.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">is not provable”</text><rect x="225" y="18" width="160" height="66" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="305" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">n = the Gödel number</text><text x="305" y="56.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">of G itself</text><line x1="190" y1="40" x2="225" y2="40" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="207" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">code</text><path d="M305,84 L305,108 L102,108 L102,86" fill="none" stroke="#8e6bbf" stroke-width="1.8" marker-end="url(#a)"/><text x="204" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#8e6bbf" font-style="italic">G is a statement about itself</text><rect x="15" y="140" width="178" height="56" rx="6" fill="#fef2f2" fill-opacity="1" stroke="#b91c1c" stroke-width="1.5"/><text x="104" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">If G is provable:</text><text x="104" y="174.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">the system proves a falsehood</text><rect x="207" y="140" width="178" height="56" rx="6" fill="#ecfdf5" fill-opacity="1" stroke="#047857" stroke-width="1.5"/><text x="296" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">If not: G is true</text><text x="296" y="174.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">but unprovable</text></svg>

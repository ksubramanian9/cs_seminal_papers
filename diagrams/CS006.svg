<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The McCulloch–Pitts neuron</title><desc>Two inputs with weight one feeding a threshold unit that computes AND; an inhibitory input can veto.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="40" cy="85" r="16" fill="#4a5fc1" fill-opacity="0.12" stroke="#4a5fc1" stroke-width="1.5"/><text x="40" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">x₁</text><circle cx="40" cy="155" r="16" fill="#4a5fc1" fill-opacity="0.12" stroke="#4a5fc1" stroke-width="1.5"/><text x="40" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">x₂</text><circle cx="205" cy="120" r="34" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="2.2"/><text x="205" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Σ ≥ 2</text><text x="205" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">threshold</text><line x1="56" y1="90" x2="172" y2="112" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="56" y1="150" x2="172" y2="130" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">1</text><text x="100" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">1</text><circle cx="205" cy="30" r="13" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="205" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">x₃</text><path d="M205,43 L205,82" fill="none" stroke="#b91c1c" stroke-width="1.5"/><circle cx="205" cy="86" r="4" fill="#b91c1c" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="255" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#b91c1c">veto (inhibitory)</text><line x1="239" y1="120" x2="300" y2="120" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="342" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">fires (1)</text><text x="342" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">or silent (0)</text><text x="200" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#4a5fc1">threshold 2: AND     threshold 1: OR</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">wired together: any logical expression</text></svg>

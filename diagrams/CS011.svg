<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Three models of language</title><desc>Finite-state models nested inside phrase-structure grammars; nested if-then and either-or pairs need memory.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="10" y="26" width="200" height="150" rx="6" fill="#8e6bbf" fill-opacity="0.08" stroke="#8e6bbf" stroke-width="2"/><text x="110" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#8e6bbf">Phrase-structure grammars</text><text x="110" y="59" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">rules like S → NP VP; nested phrases</text><rect x="26" y="72" width="168" height="62" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="110" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Finite-state (Markov)</text><text x="110" y="107" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">next word depends only</text><text x="110" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">on a bounded past</text><text x="110" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">+ transformations rearrange</text><text x="110" y="167" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">the phrase structures</text><text x="305" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#8e6bbf">nesting defeats</text><text x="305" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#8e6bbf">finite-state models</text><text x="232.7" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">if</text><text x="268.5" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">either</text><text x="300.95" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">A</text><text x="320" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">or</text><text x="339.05" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">B</text><text x="364.8" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">then</text><text x="390.55" y="120" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">C</text><path d="M232.7,108 C232.7,70 364.79999999999995,70 364.79999999999995,108" fill="none" stroke="#8e6bbf" stroke-width="1.5"/><path d="M268.5,108 C268.5,88 320.0,88 320.0,108" fill="none" stroke="#d1603d" stroke-width="1.5"/><text x="305" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">each opener waits for</text><text x="305" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">its closer: you must</text><text x="305" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">remember what is open</text></svg>

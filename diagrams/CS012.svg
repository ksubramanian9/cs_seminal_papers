<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>FORTRAN: formula in, machine code out</title><desc>A formula is turned by a compiler into load, multiply, add and store instructions.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="70" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">formula, as written</text><rect x="10" y="48" width="120" height="44" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="70" y="75" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Y = A*X + B</text><line x1="130" y1="70" x2="160" y2="70" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="160" y="40" width="90" height="66" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="2"/><text x="205" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Compiler</text><text x="205" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">parse</text><text x="205" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">optimise</text><text x="205" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">generate</text><line x1="250" y1="70" x2="282" y2="70" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="336" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">machine code</text><rect x="282" y="48" width="106" height="78" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="335" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">load X</text><text x="335" y="84" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">multiply A</text><text x="335" y="100" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">add B</text><text x="335" y="116" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">store Y</text><text x="200" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#d1603d">say what you want; the compiler works out how</text><text x="200" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">worth using only if the code is nearly as fast as hand-written</text></svg>

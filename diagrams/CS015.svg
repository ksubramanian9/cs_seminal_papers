<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Augmenting human intellect (H-LAM/T)</title><desc>A person augmented by language, artifacts, methodology and training.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="200" cy="100" r="34" fill="#6a8f2a" fill-opacity="0.16" stroke="#6a8f2a" stroke-width="2.2"/><text x="200" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Human</text><text x="200" y="113" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">augmented</text><rect x="138" y="4" width="124" height="38" rx="6" fill="#6a8f2a" fill-opacity="0.08" stroke="#6a8f2a" stroke-width="1.5"/><text x="200" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Language</text><text x="200" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">ways of expressing ideas</text><rect x="0" y="81" width="124" height="38" rx="6" fill="#6a8f2a" fill-opacity="0.08" stroke="#6a8f2a" stroke-width="1.5"/><text x="62" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Artifacts</text><text x="62" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">tools: now computers</text><rect x="276" y="81" width="124" height="38" rx="6" fill="#6a8f2a" fill-opacity="0.08" stroke="#6a8f2a" stroke-width="1.5"/><text x="338" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Methodology</text><text x="338" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">ways of working</text><rect x="138" y="150" width="124" height="38" rx="6" fill="#6a8f2a" fill-opacity="0.08" stroke="#6a8f2a" stroke-width="1.5"/><text x="200" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Training</text><text x="200" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">skills to use them</text><line x1="200" y1="42" x2="200" y2="66" stroke="#6a8f2a" stroke-width="1.8" marker-end="url(#a)"/><line x1="200" y1="150" x2="200" y2="134" stroke="#6a8f2a" stroke-width="1.8" marker-end="url(#a)"/><line x1="124" y1="100" x2="166" y2="100" stroke="#6a8f2a" stroke-width="1.8" marker-end="url(#a)"/><line x1="276" y1="100" x2="234" y2="100" stroke="#6a8f2a" stroke-width="1.8" marker-end="url(#a)"/><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#6a8f2a">improve any part, or how they fit together, and the whole improves</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Moore’s forecast</title><desc>A log-scale chart of components per chip doubling each year, extrapolated to 65,000 by 1975.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><line x1="54" y1="170.0" x2="374" y2="170.0" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">1</text><line x1="54" y1="135.0" x2="374" y2="135.0" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="139" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">16</text><line x1="54" y1="100.0" x2="374" y2="100.0" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">256</text><line x1="54" y1="65.0" x2="374" y2="65.0" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">4,096</text><line x1="54" y1="30.0" x2="374" y2="30.0" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">65,536</text><text x="54" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">1959</text><text x="174" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">1965</text><text x="274" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">1970</text><text x="374" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">1975</text><text x="204" y="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">components per chip at lowest cost (log scale)</text><path d="M54,170.0 L174,117.5" fill="none" stroke="#6b6b6b" stroke-width="3"/><path d="M174,117.5 L374,30.0" fill="none" stroke="#6b6b6b" stroke-width="2.4" stroke-dasharray="6 4"/><circle cx="54" cy="170" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="74" cy="161.25" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="94" cy="152.5" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="114" cy="143.75" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="134" cy="135" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="154" cy="126.25" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="174" cy="117.5" r="3.2" fill="#6b6b6b" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="374" cy="30" r="4" fill="#fff" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="2"/><text x="392" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#1f2937">≈ 65,000 by 1975</text><text x="392" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">(1965 forecast)</text><text x="170" y=
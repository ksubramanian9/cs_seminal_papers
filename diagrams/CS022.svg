<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Structured programming versus goto</title><desc>Crossing jump arrows beside three structured building blocks: sequence, choice and repetition.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="95" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">with goto</text><rect x="40" y="30" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="43" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">1</text><rect x="40" y="57" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="70" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">2</text><rect x="40" y="84" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="97" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">3</text><rect x="40" y="111" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="124" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">4</text><rect x="40" y="138" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="151" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">5</text><rect x="40" y="165" width="50" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="65" y="178" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">6</text><path d="M90,39 C150,39 150,120 92,120" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/><path d="M90,93 C142,93 142,174 92,174" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/><path d="M90,147 C158,147 158,66 92,66" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/><path d="M90,174 C170,174 170,39 92,39" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/><path d="M90,120 C132,120 132,147 92,147" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#a)"/><text x="95" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">where are we, and how did we get here?</text><text x="305" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">with structure</text><rect x="228" y="40" width="44" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><rect x="228" y="74" width="44" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><line x1="250" y1="58" x2="250" y2="74" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="250" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">sequence</text><path d="M305,38 L322,52 L305,66 L288,52 Z" fill="#d1603d22" stroke="#d1603d" stroke-width="1.6"/><rect x="284" y="82" width="20" height="16" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><rect x="308" y="82" width="20" height="16" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><line x1="298" y1="60" x2="294" y2="82" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="312" y1="60" x2="318" y2="82" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="306" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">choice</text><rect x="344" y="54" width="40" height="22" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><path d="M384,65 C402,65 402,40 364,40 C350,40 346,48 346,54" fill="none" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><text x="364" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">repetition</text><text x="305" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">few “coordinates” to track:</text><text x="305" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">the text order mirrors the</text><text x="305" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">order of execution</text></svg>

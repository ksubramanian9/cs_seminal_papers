<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Art of Computer Programming</title><desc>Five volumes shown as books, with Volume 1 highlighted, and a note on the MIX computer.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">The Art of Computer Programming</text><rect x="22" y="30" width="68" height="104" rx="6" fill="#d08a10" fill-opacity="0.3" stroke="#d08a10" stroke-width="2.2"/><text x="56" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Vol 1</text><text x="56" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Fundamental</text><text x="56" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Algorithms</text><text x="56" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">1968</text><rect x="94" y="30" width="68" height="104" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="128" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Vol 2</text><text x="128" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Seminumerical</text><text x="128" y="85" font-family="system-ui, -apple-system, 'Segoe 
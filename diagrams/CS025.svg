<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The THE system’s layers</title><desc>Six stacked layers from processor allocation up to the operator, and a note on semaphores.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="18" y="12" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.295" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">5</text><text x="50" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">Operator</text><rect x="18" y="40" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.25" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">4</text><text x="50" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">User programs</text><rect x="18" y="68" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.20500000000000002" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">3</text><text x="50" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">Input / output buffering</text><rect x="18" y="96" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.16" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">2</text><text x="50" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">Console messages</text><rect x="18" y="124" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.115" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">1</text><text x="50" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">Memory and drum</text><rect x="18" y="152" width="214" height="24" rx="6" fill="#a0783c" fill-opacity="0.07" stroke="#a0783c" stroke-width="1.5"/><text x="34" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">0</text><text x="50" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1f2937">Processor allocation</text><line x1="246" y1="24" x2="246" y2="168" stroke="#a0783c" stroke-width="1.6" marker-end="url(#a)"/><text x="200" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">each layer uses only the one below</text><rect x="268" y="40" width="122" height="100" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="2"/><text x="329" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Semaphores</text><text x="329" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">P(s): wait until free</text><text x="329" y="93" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">V(s): signal</text><text x="329" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">cooperating</text><text x="329" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">sequential processes</text></svg>

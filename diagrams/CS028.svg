<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Cook: satisfiability is NP-complete</title><desc>Problems in NP reduce to satisfiability, so a fast method for it would solve them all.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="10" y="20" width="104" height="26" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="62" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">scheduling</text><line x1="114" y1="33" x2="172" y2="100" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="10" y="60" width="104" height="26" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="62" y="77" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">map colouring</text><line x1="114" y1="73" x2="172" y2="100" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="10" y="100" width="104" height="26" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="62" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">clique</text><line x1="114" y1="113" x2="172" y2="100" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="10" y="140" width="104" height="26" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="62" y="157" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">any problem in NP</text><line x1="114" y1="153" x2="172" y2="100" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><text x="142" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">reduce</text><circle cx="206" cy="104" r="34" fill="#d08a10" fill-opacity="0.18" stroke="#d08a10" stroke-width="2.4"/><text x="206" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">SAT</text><text x="206" y="154" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">(x ∨ ¬y) ∧ (y ∨ z) ∧ …</text><text x="206" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">can all the conditions hold?</text><rect x="262" y="62" width="130" height="84" rx="6" fill="#d08a10" fill-opacity="0.08" stroke="#d08a10" stroke-width="1.5"/><text x="327" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">solve SAT fast,</text><text x="327" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">and every problem</text><text x="327" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">in NP is solved</text><text x="327" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">fast too</text><line x1="240" y1="104" x2="262" y2="104" stroke="#d08a10" stroke-width="2" marker-end="url(#a)"/><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d08a10">one hard problem stands for the whole class</text></svg>

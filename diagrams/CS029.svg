<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Information hiding</title><desc>A flowchart decomposition sharing one data format beside a decomposition where each module hides one decision.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="98" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">split by steps</text><rect x="10" y="30" width="40" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="30" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">read</text><line x1="30" y1="54" x2="30" y2="82" stroke="#b91c1c" stroke-width="1.2"/><rect x="56" y="30" width="40" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="76" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">shift</text><line x1="76" y1="54" x2="76" y2="82" stroke="#b91c1c" stroke-width="1.2"/><rect x="102" y="30" width="40" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="122" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">sort</text><line x1="122" y1="54" x2="122" y2="82" stroke="#b91c1c" stroke-width="1.2"/><rect x="148" y="30" width="40" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="168" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">print</text><line x1="168" y1="54" x2="168" y2="82" stroke="#b91c1c" stroke-width="1.2"/><rect x="10" y="82" width="178" height="22" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="99" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">shared data format</text><text x="99" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#b91c1c">change the format:</text><text x="99" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#b91c1c">every box changes</text><path d="M200,20 L200,150" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><text x="298" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3f8f6b">split by hidden decisions</text><rect x="210" y="28" width="88" height="38" rx="6" fill="#3f8f6b" fill-opacity="0.1" stroke="#3f8f6b" stroke-width="1.5"/><text x="254" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">line storage</text><text x="254" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">hides: how text is kept</text><rect x="302" y="28" width="88" height="38" rx="6" fill="#3f8f6b" fill-opacity="0.1" stroke="#3f8f6b" stroke-width="1.5"/><text x="346" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">alphabetizer</text><text x="346" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">hides: sorting method</text><rect x="210" y="74" width="88" height="38" rx="6" fill="#3f8f6b" fill-opacity="0.1" stroke="#3f8f6b" stroke-width="1.5"/><text x="254" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">input</text><text x="254" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">hides: file format</text><rect x="302" y="74" width="88" height="38" rx="6" fill="#3f8f6b" fill-opacity="0.1" stroke="#3f8f6b" stroke-width="1.5"/><text x="346" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">output</text><text x="346" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">hides: page layout</text><text x="298" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">others see only a small interface</text><text x="298" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#3f8f6b">a change stays inside one module</text><text x="200" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">divide by what is likely to change, not by the order of steps</text></svg>

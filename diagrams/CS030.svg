<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>B-tree</title><desc>A root with two keys pointing to three child pages, with a note on splitting full pages.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="168" y="18" width="32" height="24" rx="2" fill="#d08a10" fill-opacity="0.2" stroke="#d08a10" stroke-width="1.6"/><text x="184" y="34" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">30</text><rect x="200" y="18" width="32" height="24" rx="2" fill="#d08a10" fill-opacity="0.2" stroke="#d08a10" stroke-width="1.6"/><text x="216" y="34" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">60</text><rect x="58" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="74" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">10</text><rect x="90" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="106" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">20</text><line x1="168" y1="42" x2="90" y2="86" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="168" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="184" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">40</text><rect x="200" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="216" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">50</text><line x1="200" y1="42" x2="200" y2="86" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="262" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="278" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">70</text><rect x="294" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="310" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">80</text><rect x="326" y="86" width="32" height="24" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="342" y="102" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">90</text><line x1="232" y1="42" x2="310" y2="86" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><text x="352" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">few levels, wide nodes</text><text x="110" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">each node is one disk page</text><text x="110" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">holding hundreds of keys</text><rect x="214" y="128" width="172" height="44" rx="6" fill="#d08a10" fill-opacity="0.08" stroke="#d08a10" stroke-width="1.5"/><text x="300" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">page full? split it in two and</text><text x="300" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">push the middle key up</text><text x="200" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d08a10">a few page reads reach any of millions of records</text></svg>

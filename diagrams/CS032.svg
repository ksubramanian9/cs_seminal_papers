<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>TCP/IP: joining networks</title><desc>A datagram crossing three networks and two gateways, with TCP at the ends and IP at every hop.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">a datagram carries a destination: network + host</text><rect x="23" y="48" width="40" height="34" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="43" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Host</text><rect x="339" y="48" width="44" height="34" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="361" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Host</text><rect x="69" y="44" width="70" height="42" rx="18" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.5"/><text x="104" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">network 1</text><rect x="163" y="44" width="70" height="42" rx="18" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.5"/><text x="198" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">network 2</text><rect x="257" y="44" width="70" height="42" rx="18" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.5"/><text x="292" y="69" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">network 3</text><path d="M151,57 L161,67 L151,77 L141,67 Z" fill="#fff" stroke="#4b5563" stroke-width="1.5"/><path d="M245,57 L255,67 L245,77 L235,67 Z" fill="#fff" stroke="#4b5563" stroke-width="1.5"/><line x1="63" y1="66" x2="69" y2="66" stroke="#4b5563" stroke-width="1.5"/><line x1="139" y1="66" x2="141" y2="66" stroke="#4b5563" stroke-width="1.5"/><line x1="161" y1="66" x2="163" y2="66" stroke="#4b5563" stroke-width="1.5"/><line x1="233" y1="66" x2="235" y2="66" stroke="#4b5563" stroke-width="1.5"/><line x1="255" y1="66" x2="257" y2="66" stroke="#4b5563" stroke-width="1.5"/><line x1="327" y1="66" x2="339" y2="66" stroke="#4b5563" stroke-width="1.5"/><text x="151" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">gateway</text><text x="245" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">gateway</text><rect x="23" y="110" width="360" height="28" rx="6" fill="#2aa6a6" fill-opacity="0.14" stroke="#2aa6a6" stroke-width="1.5"/><text x="203" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">TCP, at the two ends: acknowledge · reorder · resend</text><rect x="23" y="144" width="360" height="28" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="1.5"/><text x="203" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">IP, at every hop: forward datagrams by address</text><text x="200" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2aa6a6" font-style="italic">the networks in between may be different and unreliable</text></svg>

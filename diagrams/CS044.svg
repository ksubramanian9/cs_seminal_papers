<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Model checking</title><desc>A state graph explored automatically, with a red counterexample path to a bad state.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><line x1="60.3293" y1="57.5647" x2="114.715" y2="40.7309" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/><line x1="144.329" y1="40.4353" x2="198.715" y2="57.2691" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/><line x1="199" y1="62" x2="62" y2="62" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/><line x1="143.904" y1="90.3721" x2="199.169" y2="68.0031" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/><line x1="59.9042" y1="67.6279" x2="115.169" y2="89.9969" stroke="#b91c1c" stroke-width="3" marker-end="url(#a)"/><line x1="130" y1="111" x2="130" y2="136" stroke="#b91c1c" stroke-width="3" marker-end="url(#a)"/><circle cx="46" cy="62" r="15" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="2.2"/><text x="46" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">s0</text><circle cx="130" cy="36" r="15" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="2.2"/><text x="130" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">s1</text><circle cx="130" cy="96" r="15" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="2.2"/><text x="130" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">s2</text><circle cx="214" cy="62" r="15" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="2.2"/><text x="214" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">s3</text><circle cx="130" cy="152" r="15" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="2.2"/><text x="130" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">bad</text><text x="60" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c" font-style="italic">counterexample</text><rect x="250" y="30" width="142" height="34" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="321" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">property</text><text x="321" y="58" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">AG ¬bad</text><text x="321" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">explore every state</text><text x="321" y="107" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">automatically, and</text><text x="321" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">check the property</text><text x="321" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">fails? you get the path</text><text x="321" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">that leads to the bug</text><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d1603d">verification done by a tool, not by hand</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Byzantine generals problem</title><desc>A commander and three lieutenants, one a traitor, where the loyal ones still agree by majority.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="150" y="8" width="100" height="26" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Commander</text><rect x="22" y="110" width="96" height="30" rx="6" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.8"/><text x="70" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Lieutenant 1</text><line x1="200" y1="34" x2="70" y2="110" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><rect x="152" y="110" width="96" height="30" rx="6" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.8"/><text x="200" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Lieutenant 2</text><line x1="200" y1="34" x2="200" y2="110" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><rect x="282" y="110" width="96" height="30" rx="6" fill="#fef2f2" fill-opacity="1" stroke="#b91c1c" stroke-width="1.8"/><text x="330" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">Lieutenant 3</text><line x1="200" y1="34" x2="330" y2="110" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="110" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">“attack”</text><text x="200" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">“attack”</text><text x="300" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">“attack”</text><line x1="122" y1="118" x2="152" y2="118" stroke="#2aa6a6" stroke-width="1.5" marker-end="url(#a)"/><line x1="152" y1="128" x2="122" y2="128" stroke="#2aa6a6" stroke-width="1.5" marker-end="url(#a)"/><line x1="282" y1="120" x2="252" y2="120" stroke="#b91c1c" stroke-width="2" marker-end="url(#a)"/><text x="268" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#b91c1c">“retreat”</text><text x="70" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">heard attack,</text><text x="70" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">attack, retreat:</text><text x="70" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857">majority attack ✓</text><text x="200" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">also agrees:</text><text x="200" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857">majority attack ✓</text><text x="330" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">the traitor</text><text x="330" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">tells different lies</text><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2aa6a6">3m + 1 generals can tolerate m traitors</text></svg>

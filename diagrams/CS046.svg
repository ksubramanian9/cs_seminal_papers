<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The end-to-end argument</title><desc>A file crossing three hops that each pass a check, with a corruption only the receiving end can detect.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="54" width="52" height="40" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="34" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Host A</text><rect x="340" y="54" width="52" height="40" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="366" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Host B</text><text x="8" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#b91c1c">✗ corrupted here</text><line x1="60" y1="74" x2="92" y2="74" stroke="#4b5563" stroke-width="1.5"/><circle cx="112" cy="74" r="20" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.8"/><text x="112" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">hop</text><text x="112" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#047857">✓</text><line x1="132" y1="74" x2="180" y2="74" stroke="#4b5563" stroke-width="1.5"/><circle cx="200" cy="74" r="20" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.8"/><text x="200" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">hop</text><text x="200" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#047857">✓</text><line x1="220" y1="74" x2="268" y2="74" stroke="#4b5563" stroke-width="1.5"/><circle cx="288" cy="74" r="20" fill="#2aa6a6" fill-opacity="0.12" stroke="#2aa6a6" stroke-width="1.8"/><text x="288" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">hop</text><text x="288" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#047857">✓</text><line x1="308" y1="74" x2="340" y2="74" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><text x="200" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">every hop checks its own link: all pass</text><path d="M34,108 L34,118 L366,118 L366,108" fill="none" stroke="#b91c1c" stroke-width="1.8"/><text x="200" y="135" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">only an end-to-end check catches it</text><rect x="110" y="148" width="180" height="26" rx="6" fill="#2aa6a6" fill-opacity="0.14" stroke="#2aa6a6" stroke-width="1.5"/><text x="200" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">receiver checks the whole file</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">checks in the middle help speed, but cannot replace the ends</text></svg>

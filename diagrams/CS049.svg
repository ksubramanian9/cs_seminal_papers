<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Shared memory, shared disk, shared nothing</title><desc>Three parallel database architectures; shared nothing gives each node its own memory and disk.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="66" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">shared memory</text><text x="200" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">shared disk</text><text x="334" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f7fb0">shared nothing</text><rect x="11" y="34" width="30" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="26" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><line x1="26" y1="54" x2="26" y2="84" stroke="#4b5563" stroke-width="1.2"/><rect x="51" y="34" width="30" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="66" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><line x1="66" y1="54" x2="66" y2="84" stroke="#4b5563" stroke-width="1.2"/><rect x="91" y="34" width="30" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="106" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><line x1="106" y1="54" x2="106" y2="84" stroke="#4b5563" stroke-width="1.2"/><rect x="8" y="84" width="116" height="22" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="66" y="99" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">one memory</text><line x1="66" y1="106" x2="66" y2="122" stroke="#4b5563" stroke-width="1.2"/><rect x="42" y="122" width="48" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="66" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">disk</text><text x="66" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#b91c1c">bottleneck: memory</text><rect x="143" y="34" width="34" height="34" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="160" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><text x="160" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">mem</text><line x1="160" y1="68" x2="160" y2="100" stroke="#4b5563" stroke-width="1.2"/><rect x="183" y="34" width="34" height="34" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><text x="200" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">mem</text><line x1="200" y1="68" x2="200" y2="100" st
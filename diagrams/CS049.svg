anchor="middle" fill="#1f2937">disk</text><line x1="334" y1="36" x2="334" y2="46" stroke="#2f7fb0" stroke-width="2"/><rect x="317" y="46" width="34" height="74" rx="3" fill="#2f7fb0" fill-opacity="0.1" stroke="#2f7fb0" stroke-width="1.5"/><text x="334" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><text x="334" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">mem</text><text x="334" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">disk</text><line x1="374" y1="36" x2="374" y2="46" stroke="#2f7fb0" stroke-width="2"/><rect x="357" y="46" width="34" height="74" rx="3" fill="#2f7fb0" fill-opacity="0.1" stroke="#2f7fb0" stroke-width="1.5"/><text x="374" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">cpu</text><text x="374" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">mem</text><text x="374" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#1f2937">disk</text><text x="334" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#2f7fb0">each node owns its data</text><text x="334" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2f7fb0">add nodes to add capacity</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">partition the data and run queries where the data lives</text></svg>

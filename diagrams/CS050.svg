<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>No Silver Bullet</title><desc>Essential and accidental difficulty in software, with the four essential properties.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="60" y="22" width="280" height="28" rx="6" fill="#3f8f6b" fill-opacity="0.1" stroke="#3f8f6b" stroke-width="1.5"/><text x="200" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">accidental: tools, languages, machines (largely tamed)</text><rect x="60" y="50" width="280" height="102" rx="6" fill="#3f8f6b" fill-opacity="0.28" stroke="#3f8f6b" stroke-width="2"/><text x="200" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">essential: the design of interlocking concepts</text><rect x="66" y="100" width="64" height="36" rx="4" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.4"/><text x="98" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">complexity</text><rect x="135" y="100" width="64" height="36" rx="4" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.4"/><text x="167" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">conformity</text><rect x="204" y="100" width="64" height="36" rx="4" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.4"/><text x="236" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">changeability</text><rect x="273" y="100" width="64" height="36" rx="4" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.4"/><text x="305" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">invisibility</text><text x="200" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">no single silver bullet removes the essential part</text><text x="200" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">past breakthroughs mostly shrank the accidental part</text></svg>

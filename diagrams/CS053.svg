<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Behavioural subtyping</title><desc>A square that breaks code written for rectangles, and the rules for safe substitution.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="36" y="12" width="124" height="32" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="98" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Rectangle</text><text x="98" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">setWidth, setHeight</text><rect x="36" y="64" width="124" height="32" rx="6" fill="#d1603d" fill-opacity="0.12" stroke="#d1603d" stroke-width="1.5"/><text x="98" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Square</text><text x="98" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">is it a subtype?</text><line x1="98" y1="64" x2="98" y2="44" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><text x="98" y="118" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">r.setWidth(4)</text><text x="98" y="132" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">r.setHeight(5)</text><text x="98" y="146" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">area should be 20</text><rect x="30" y="160" width="136" height="28" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="98" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">Square gives 25 ✗</text><rect x="206" y="22" width="186" height="150" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="299" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">safe to substitute when</text><text x="220" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">✓ preconditions</text><text x="236" y="81" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">no stronger</text><text x="220" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">✓ postconditions</text><text x="236" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">no weaker</text><text x="220" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">✓ invariants</text><text x="236" y="149" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">preserved</text><text x="299" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#d1603d">inheritance should model behaviour</text></svg>

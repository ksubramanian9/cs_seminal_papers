<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Support-vector machines</title><desc>Two classes separated by a line in the middle of the widest empty margin, with support vectors ringed.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="148" y="22" width="46" height="158" rx="0" fill="#4a5fc1" fill-opacity="0.08" stroke="none" stroke-width="1.5"/><line x1="171" y1="22" x2="171" y2="180" stroke="#4a5fc1" stroke-width="2.6"/><line x1="148" y1="22" x2="148" y2="180" stroke="#4a5fc1" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="194" y1="22" x2="194" y2="180" stroke="#4a5fc1" stroke-width="1.3" stroke-dasharray="5 4"/><circle cx="34" cy="56" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="58" cy="98" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="86" cy="46" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="72" cy="134" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="108" cy="76" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="100" cy="160" r="6" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.4"/><circle cx="148" cy="92" r="6" fill="#4a5fc1" fill-opacity="1" stroke="#4a5fc1" stroke-width="3"/><circle cx="148" cy="142" r="6" fill="#4a5fc1" fill-opacity="1" stroke="#4a5fc1" stroke-width="3"/><rect x="188" y="64" width="12" height="12" rx="1" fill="#e8743b" fill-opacity="1" stroke="#e8743b" stroke-width="3"/><rect x="188" y="118" width="12" height="12" rx="1" fill="#e8743b" fill-opacity="1" stroke="#e8743b" stroke-width="3"/><rect x="230" y="44" width="12" height="12" rx="1" fill="#e8743b" fill-opacity="0.5" stroke="#e8743b" stroke-width="1.4"/><r
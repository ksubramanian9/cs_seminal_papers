<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Reinforcement learning</title><desc>An agent and an environment exchanging actions, states and rewards, with three families of learning methods.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="24" y="56" width="104" height="54" rx="6" fill="#4a5fc1" fill-opacity="0.14" stroke="#4a5fc1" stroke-width="2"/><text x="76" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Agent</text><rect x="272" y="56" width="104" height="54" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="2"/><text x="324" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Environment</text><line x1="128" y1="70" x2="272" y2="70" stroke="#4a5fc1" stroke-width="2.2" marker-end="url(#a)"/><text x="200" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">action</text><line x1="272" y1="98" x2="128" y2="98" stroke="#047857" stroke-width="2.2" marker-end="url(#a)"/><text x="200" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857">new state + reward</text><text x="200" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">try, observe the consequence, adjust</text><text x="200" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">three ways to learn how good states and actions are</text><rect x="14" y="148" width="116" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.08" stroke="#4a5fc1" stroke-width="1.5"/><text x="72" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">dynamic programming</text><rect x="142" y="148" width="116" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.08" stroke="#4a5fc1" stroke-width="1.5"/><text x="200" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Monte Carlo</text><rect x="270" y="148" width="116" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.08" stroke="#4a5fc1" stroke-width="1.5"/><text x="328" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">temporal difference</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">goal: choose actions that maximise total reward over time</text></svg>

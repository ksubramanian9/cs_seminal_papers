<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Paxos</title><desc>A proposer and three acceptors exchanging prepare, promise, accept and accepted messages.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="6" y="6" width="68" height="22" rx="4" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="40" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2937">proposer</text><line x1="40" y1="28" x2="40" y2="182" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="86" y="6" width="68" height="22" rx="4" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="120" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2937">acceptor 1</text><line x1="120" y1="28" x2="120" y2="182" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="166" y="6" width="68" height="22" rx="4" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2937">acceptor 2</text><line x1="200" y1="28" x2="200" y2="182" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="246" y="6" width="68" height="22" rx="4" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="280" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2937">acceptor 3</text><line x1="280" y1="28" x2="280" y2="182" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="40" y1="50" x2="120" y2="60" stroke="#2aa6a6" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="124" x2="120" y2="134" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="50" x2="200" y2="60" stroke="#2aa6a6" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="124" x2="200" y2="134" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="50" x2="280" y2="60" stroke="#2aa6a6" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="124" x2="280" y2="134" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><line x1="120" y1="84" x2="40" y2="94" stroke="#2aa6a6" stroke-width="1.6" marker-end="url(#a)"/><line x1="120" y1="156" x2="40" y2="166" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="84" x2="40" y2="94" stroke="#2aa6a6" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="156" x2="40" y2="166" stroke="#d1603d" stroke-width="1.6" marker-end="url(#a)"/><line x1="280" y1="84" x2="44" y2="96" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="284" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">slow</text><text x="312" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2aa6a6">1. prepare</text><text x="312" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#6b7280">to everyone</text><text x="312" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#2aa6a6">1. promise</text><text x="312" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#6b7280">from a majority</text><text x="312" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#d1603d">2. accept</text><text x="312" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#6b7280">to everyone</text><text x="312" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#d1603d">2. accepted</text><text x="312" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#6b7280">by a majority</text><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">any two majorities overlap, so a chosen value is never lost</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Agile Manifesto</title><desc>Four pairs of values, what is valued more set over what is valued less.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="10" width="178" height="32" rx="6" fill="#3f8f6b" fill-opacity="0.2" stroke="#3f8f6b" stroke-width="2"/><text x="97" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Individuals and interactions</text><text x="200" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">over</text><rect x="216" y="10" width="176" height="32" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="304" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">processes and tools</text><rect x="8" y="50" width="178" height="32" rx="6" fill="#3f8f6b" fill-opacity="0.2" stroke="#3f8f6b" stroke-width="2"/><text x="97" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Working software</text><text x="200" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">over</text><rect x="216" y="50" width="176" height="32" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="304" y="71" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">comprehensive documentation</text><rect x="8" y="90" width="178" height="32" rx="6" fill="#3f8f6b" fill-opacity="0.2" stroke="#3f8f6b" stroke-width="2"/><text x="97" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Customer collaboration</text><text x="200" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">over</text><rect x="216" y="90" width="176" height="32" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="304" y="111" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">contract negotiation</text><rect x="8" y="130" width="178" height="32" rx="6" fill="#3f8f6b" fill-opacity="0.2" stroke="#3f8f6b" stroke-width="2"/><text x="97" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Responding to change</text><text x="200" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">over</text><rect x="216" y="130" width="176" height="32" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="304" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">following a plan</text><text x="200" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">while there is value in the items on the right,</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">we value the items on the left more</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The CAP theorem</title><desc>Two nodes with a broken link: the node that missed a write must answer stale data or refuse to answer.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="20" y="44" width="110" height="44" rx="6" fill="#2aa6a6" fill-opacity="0.14" stroke="#2aa6a6" stroke-width="2"/><text x="75" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Node 1</text><text x="75" y="78" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">write x = 5</text><rect x="270" y="44" width="110" height="44" rx="6" fill="#2aa6a6" fill-opacity="0.14" stroke="#2aa6a6" stroke-width="2"/><text x="325" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Node 2</text><text x="325" y="78" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">read x</text><line x1="130" y1="66" x2="270" y2="66" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/><text x="200" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#b91c1c">✗</text><text x="200" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#b91c1c">network partition</text><text x="200" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">the two nodes cannot talk to each other</text><line x1="325" y1="88" x2="120" y2="120" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><line x1="325" y1="88" x2="288" y2="120" stroke="#6b7280" stroke-width="1.3" marker-end="url(#a)"/><rect x="24" y="120" width="190" height="48" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="119" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">answers with the old x = 3</text><text x="119" y="153" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">stale: not consistent</text><rect x="224" y="120" width="160" height="48" rx="6" fill="#fff7ed" fill-opacity="1.0" stroke="#c2410c" stroke-width="1.5"/><text x="304" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">waits, gives no answer</text><text x="304" y="153" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">not available</text><text x="200" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2aa6a6">during a partition, choose consistency or availability</text></svg>

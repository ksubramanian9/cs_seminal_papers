<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Dynamo</title><desc>A ring of six nodes where a key is stored on three consecutive nodes, with notes on N, R and W and on vector clocks.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="110" cy="108" r="64" fill="none" fill-opacity="1.0" stroke="#d1d5db" stroke-width="1.6"/><circle cx="110" cy="44" r="12" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="2"/><text x="110" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">A</text><circle cx="165.426" cy="76" r="12" fill="#2aa6a6" fill-opacity="0.35" stroke="#2aa6a6" stroke-width="2"/><text x="165.426" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">B</text><circle cx="165.426" cy="140" r="12" fill="#2aa6a6" fill-opacity="0.35" stroke="#2aa6a6" stroke-width="2"/><text x="165.426" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">C</text><circle cx="110" cy="172" r="12" fill="#2aa6a6" fill-opacity="0.35" stroke="#2aa6a6" stroke-width="2"/><text x="110" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">D</text><circle cx="54.5744" cy="140" r="12" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="2"/><text x="54.5744" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">E</text><circle cx="54.5744" cy="76" r="12" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="2"/><text x="54.5744" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">F</text><path d="M142.0,45.57437415779593 L148.0,52.57437415779593 L142.0,59.57437415779593 L136.0,52.57437415779593 Z" fill="#d1242f" stroke="#d1242f" stroke-width="1.5"/><text x="154" y="40.5744" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#d1242f">key</text><text x="110" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">hash ring</text><text x="110" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">N = 3 copies</text><text x="232" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1f2937">key → next three nodes</text><text x="232" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1f2937">write waits for W acks</text><text x="232" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#1f2937">read asks R replicas</text><text x="232" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b7280" font-style="italic">R + W &gt; N: reads see the latest</text><text x="232" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b7280" font-style="italic">smaller: faster, always available</text><text x="232" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#1f2937">conflicting versions?</text><text x="232" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#1f2937">keep both (vector clocks),</text><text x="232" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#1f2937">reconcile on read</text><text x="200" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">always writeable: availability first, reconcile later</text></svg>

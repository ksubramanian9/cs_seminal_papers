<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Bitcoin blockchain</title><desc>A chain of blocks each holding transactions, a proof-of-work number and the hash of the previous block.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="24" y="34" width="82" height="86" rx="6" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="65" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">block 1</text><text x="65" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">prev: #9f3a</text><text x="65" y="84" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">A→B 2.0 ₿</text><text x="65" y="98" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">nonce 40913</text><text x="65" y="112" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="700" text-anchor="middle" fill="#c2476b">0000a3f…</text><rect x="114" y="34" width="82" height="86" rx="6" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="155" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">block 2</text><text x="155" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">prev: #1c7e</text><text x="155" y="84" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">A→B 2.0 ₿</text><text x="155" y="98" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">nonce 77102</text><text x="155" y="112" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="700" text-anchor="middle" fill="#c2476b">000071c…</text><line x1="114" y1="76" x2="106" y2="76" stroke="#c2476b" stroke-width="1.8" marker-end="url(#a)"/><rect x="204" y="34" width="82" height="86" rx="6" fill="#c2476b" fill-opacity="0.14" stroke="#c2476b" stroke-width="2.2"/><text x="245" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2476b">block 3</text><text x="245" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">prev: #b042</text><text x="245" y="84" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">A→B 2.0 ₿</text><text x="245" y="98" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">nonce 31844</text><text x="245" y="112" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="700" text-anchor="middle" fill="#c2476b">00009be…</text><line x1="204" y1="76" x2="196" y2="76" stroke="#c2476b" stroke-width="1.8" marker-end="url(#a)"/><rect x="294" y="34" width="82" height="86" rx="6" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.6"/><text x="335" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">block 4</text><text x="335" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">prev: #5de1</text><text x="335" y="84" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#6b7280">A→B 2.0 ₿</text><text x="335" y="98" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="normal" text-anchor="middle" fill="#1f2937">nonce 90577</text><text x="335" y="112" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.8" font-weight="700" text-anchor="middle" fill="#c2476b">0000d20…</text><line x1="294" y1="76" x2="286" y2="76" stroke="#c2476b" stroke-width="1.8" marker-end="url(#a)"/><text x="200" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">each block holds the hash of the one before it</text><text x="200" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">proof of work: find a nonce so the block’s hash</text><text x="200" y="157" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">starts with many zeros; that takes real computing</text><text x="200" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c2476b">rewrite an old block and you must redo the work of every later one</text></svg>

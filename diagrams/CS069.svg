<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Spanner and TrueTime</title><desc>A shard replicated across three datacentres, and a TrueTime interval with a commit wait.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="14" y="12" width="110" height="52" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="69" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">datacentre 1</text><rect x="34" y="34" width="70" height="22" rx="3" fill="#2aa6a6" fill-opacity="0.22" stroke="#2aa6a6" stroke-width="1.5"/><text x="69" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">replica</text><rect x="145" y="12" width="110" height="52" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="200" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">datacentre 2</text><rect x="165" y="34" width="70" height="22" rx="3" fill="#2aa6a6" fill-opacity="0.22" stroke="#2aa6a6" stroke-width="1.5"/><text x="200" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">replica</text><rect x="276" y="12" width="110" height="52" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="331" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">datacentre 3</text><rect x="296" y="34" width="70" height="22" rx="3" fill="#2aa6a6" fill-opacity="0.22" stroke="#2aa6a6" stroke-width="1.5"/><text x="331" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">replica</text><path d="M69,56 L69,76 L331,76 L331,56" fill="none" stroke="#2aa6a6" stroke-width="1.8"/><path d="M200,56 L200,76" fill="none" stroke="#2aa6a6" stroke-width="1.8"/><text x="200" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2aa6a6">one shard, three copies kept in agreement by Paxos</text><text x="200" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">TrueTime: the clock returns an interval, not a single time</text><line x1="24" y1="156" x2="380" y2="156" stroke="#4b5563" stroke-width="1.6"/><rect x="130" y="142" width="70" height="28" rx="2" fill="#2aa6a6" fill-opacity="0.22" stroke="#2aa6a6" stroke-width="1.6"/><text x="124" y="146" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="end" fill="#2aa6a6">[earliest, latest]</text><line x1="200" y1="134" x2="200" y2="172" stroke="#d1242f" stroke-width="2"/><text x="200" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#d1242f">commit timestamp s</text><line x1="202" y1="156" x2="286" y2="156" stroke="#047857" stroke-width="2.2" marker-end="url(#a)"/><text x="244" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#047857">wait</text><line x1="290" y1="140" x2="290" y2="172" stroke="#047857" stroke-width="2"/><text x="300" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#047857">now visible</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2aa6a6">wait out the uncertainty, and order matches real time</text></svg>

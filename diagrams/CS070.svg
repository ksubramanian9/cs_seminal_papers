<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Generative adversarial networks</title><desc>A generator and a discriminator trained against each other.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="34" width="74" height="30" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="45" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">random noise</text><line x1="82" y1="49" x2="104" y2="49" stroke="#4a5fc1" stroke-width="1.8" marker-end="url(#a)"/><rect x="104" y="28" width="84" height="42" rx="6" fill="#4a5fc1" fill-opacity="0.2" stroke="#4a5fc1" stroke-width="2"/><text x="146" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Generator</text><text x="146" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">the forger</text><line x1="188" y1="49" x2="210" y2="49" stroke="#4a5fc1" stroke-width="1.8" marker-end="url(#a)"/><rect x="210" y="34" width="52" height="30" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#d1242f" stroke-width="1.5"/><text x="236" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d1242f">fake</text><rect x="210" y="108" width="52" height="30" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="236" y="127" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857">real</text><text x="236" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">training data</text><rect x="296" y="64" width="92" height="56" rx="6" fill="#4a5fc1" fill-opacity="0.2" stroke="#4a5fc1" stroke-width="2"/><text x="342" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">Discriminator</text><text x="342" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">the detective</text><text x="342" y="113" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">real or fake?</text><line x1="262" y1="52" x2="296" y2="78" stroke="#d1242f" stroke-width="1.6" marker-end="url(#a)"/><line x1="262" y1="120" x2="296" y2="106" stroke="#047857" stroke-width="1.6" marker-end="url(#a)"/><path d="M342,64 L342,10 L146,10 L146,28" fill="none" stroke="#d1242f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="244" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#d1242f">verdict: the generator learns to fool it</text><path d="M342,120 L342,168 L110,168" fill="none" stroke="#4a5fc1" stroke-width="1.4" stroke-dasharray="5 4"/><text x="226" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">and the detective learns to spot fakes</text><text x="110" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#6b7280" font-style="italic">trained together as a game</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">each side improves because the other does</text></svg>

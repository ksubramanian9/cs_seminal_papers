<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>ResNet: residual learning</title><desc>A residual block with a shortcut that carries the input around two layers and adds it to their output.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="24" cy="72" r="14" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="24" y="77" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">x</text><line x1="38" y1="72" x2="78" y2="72" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="78" y="54" width="68" height="36" rx="6" fill="#4a5fc1" fill-opacity="0.14" stroke="#4a5fc1" stroke-width="1.5"/><text x="112" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">layer</text><line x1="146" y1="72" x2="166" y2="72" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="166" y="54" width="68" height="36" rx="6" fill="#4a5fc1" fill-opacity="0.14" stroke="#4a5fc1" stroke-width="1.5"/><text x="200" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">layer</text><line x1="234" y1="72" x2="262" y2="72" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><circle cx="276" cy="72" r="13" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="2.2"/><text x="276" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4a5fc1">+</text><line x1="289" y1="72" x2="322" y2="72" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="322" y="56" width="70" height="32" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="357" y="77" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">F(x) + x</text><path d="M32,60 L32,24 L276,24 L276,58" fill="none" stroke="#047857" stroke-width="2.4" marker-end="url(#a)"/><text x="154" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#047857">shortcut: carries x unchanged</text><text x="156" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">F(x): the layers learn only the change</text><text x="200" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">if a block should do nothing, F(x) = 0: easy to learn</text><text x="200" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">the signal also flows straight through, so training</text><text x="200" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">works with hundreds of layers</text><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">152 layers · 3.6% top-5 error (2015)</text></svg>

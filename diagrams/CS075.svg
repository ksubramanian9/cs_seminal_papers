<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Transformer</title><desc>Self-attention arcs from the word sat to every other word, and the main parts of a layer.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">every word looks at every other word, all at once</text><rect x="14" y="88" width="52" height="24" rx="4" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="40" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">The</text><rect x="78" y="88" width="52" height="24" rx="4" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="104" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">cat</text><rect x="142" y="88" width="52" height="24" rx="4" fill="#4a5fc1" fill-opacity="0.25" stroke="#4a5fc1" stroke-width="2"/><text x="168" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">sat</text><rect x="206" y="88" width="52" height="24" rx="4" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="232" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">on</text><rect x="270" y="88" width="52" height="24" rx="4" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="296" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">the</text><rect x="334" y="88" width="52" height="24" rx="4" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="360" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">mat</text><path d="M168,88 C168,30.159999999999997 40,30.159999999999997 40,88" fill="none" stroke="#4a5fc1" stroke-width="1.3"/><path d="M37,82 L40,88 L43,82" fill="none" stroke="#4a5fc1" stroke-width="1.4"/><path d="M168,88 C168,48.08 104,48.08 104,88" fill="none" stroke="#4a5fc1" stroke-width="4"/><path d="M101,82 L104,88 L107,82" fill="none" stroke="#4a5fc1" stroke-width="1.4"/><path d="M168,88 C168,48.08 232,48.08 232,88" fill="none" stroke="#4a5fc1" stroke-width="1.3"/><path d="M229,82 L232,88 L235,82" fill="none" stroke="#4a5fc1" stroke-width="1.4"/><path d="M168,88 C168,30.159999999999997 296,30.159999999999997 296,88" fill="none" stroke="#4a5fc1" stroke-width="1.3"/><path d="M293,82 L296,88 L299,82" fill="none" stroke="#4a5fc1" stroke-width="1.4"/><path d="M168,88 C168,12.239999999999995 360,12.239999999999995 360,88" fill="none" stroke="#4a5fc1" stroke-width="4"/><path d="M357,82 L360,88 L363,82" fill="none" stroke="#4a5fc1" stroke-width="1.4"/><rect x="12" y="134" width="86" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="55" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">self-attention</text><rect x="106" y="134" width="86" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="149" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">feed-forward</text><rect x="200" y="134" width="86" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="243" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">+ residual</text><rect x="294" y="134" width="86" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="337" y="151" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">+ position</text><text x="200" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">no recurrence: all positions are processed in parallel</text><text x="200" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">thick arcs: “sat” attends most to “cat” and “mat”</text></svg>

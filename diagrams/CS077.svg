<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>GPT-3 few-shot prompting</title><desc>A prompt with two translation examples and a new word, answered by a large language model with no further training.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="18" width="232" height="100" rx="6" fill="#f9fafb" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="18" y="40" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1f2937">Translate English to French:</text><text x="18" y="58" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1f2937">sea otter =&gt; loutre de mer</text><text x="18" y="76" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#1f2937">cheese =&gt; fromage</text><rect x="14" y="80" width="220" height="22" rx="3" fill="#fef9c3" fill-opacity="1.0" stroke="#ca8a04" stroke-width="1.5"/><text x="22" y="95" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">bread =&gt;</text><text x="124" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">the examples are in the prompt:</text><text x="124" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">no retraining</text><line x1="240" y1="68" x2="276" y2="68" stroke="#4a5fc1" stroke-width="2.2" marker-end="url(#a)"/><circle cx="322" cy="68" r="40" fill="#4a5fc1" fill-opacity="0.18" stroke="#4a5fc1" stroke-width="2.4"/><text x="322" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">GPT-3</text><text x="322" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">175 billion</text><text x="322" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">parameters</text><line x1="322" y1="108" x2="322" y2="134" stroke="#4a5fc1" stroke-width="2.2" marker-end="url(#a)"/><rect x="292" y="134" width="60" height="26" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="322" y="152" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#047857">pain</text><text x="200" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">trained only to predict the next word,</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">yet it learns the task from the pattern</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Codex and HumanEval</title><desc>A function signature, the model-written body, and unit tests that decide whether it counts.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="16" width="170" height="70" rx="6" fill="#f9fafb" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="14" y="34" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">def is_even(n):</text><text x="14" y="51" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">    """True if n is even."""</text><text x="93" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">prompt: signature + description</text><line x1="178" y1="51" x2="222" y2="51" stroke="#3f8f6b" stroke-width="2.2" marker-end="url(#a)"/><text x="200" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#3f8f6b">model</text><rect x="222" y="16" width="170" height="70" rx="6" fill="#3f8f6b" fill-opacity="0.12" stroke="#3f8f6b" stroke-width="2"/><text x="230" y="50" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">    return n % 2 == 0</text><text x="307" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">the model writes the body</text><rect x="8" y="100" width="250" height="58" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="16" y="117" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">is_even(4) == True</text><text x="16" y="131" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">is_even(7) == False</text><text x="16" y="145" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="normal" text-anchor="start" fill="#1f2937">is_even(0) == True</text><text x="236" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">✓</text><text x="236" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">✓</text><text x="236" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">✓</text><text x="134" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">unit tests: run the code and see</text><text x="328" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">pass@1</text><text x="328" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3f8f6b">≈ 29%</text><text x="328" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">pass@100</text><text x="328" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3f8f6b">≈ 72%</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">correct means the tests pass, not that the text matches</text></svg>

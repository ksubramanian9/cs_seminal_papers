<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Church’s lambda calculus</title><desc>A lambda application reduces by substitution; three definitions of computable functions coincide.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Everything is a function; computing = substitution</text><rect x="15" y="36" width="130" height="40" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="80" y="61" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">(λx. x + 1) 2</text><line x1="145" y1="56" x2="178" y2="56" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="178" y="36" width="80" height="40" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="218" y="61" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">2 + 1</text><line x1="258" y1="56" x2="290" y2="56" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="36" width="54" height="40" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="317" y="61" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2937">3</text><text x="161" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">apply</text><text x="274" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">simplify</text><text x="200" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">Three independent definitions of “calculable”</text><rect x="12" y="140" width="112" height="38" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="68" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">λ-definable</text><rect x="146" y="140" width="112" height="38" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="202" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Turing-computable</text><rect x="280" y="140" width="112" height="38" rx="6" fill="#8e6bbf" fill-opacity="0.1" stroke="#8e6bbf" stroke-width="1.5"/><text x="336" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">General recursive</text><text x="135" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#8e6bbf">=</text><text x="269" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#8e6bbf">=</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">cover exactly the same functions</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>A Turing machine</title><desc>A tape of symbols, a read-write head and a finite state table with one rule.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">tape, unbounded in both directions</text><rect x="20" y="48" width="40" height="40" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="40" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#6b7280">·</text><rect x="60" y="48" width="40" height="40" rx="2" fill="#8e6bbf" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.5"/><text x="80" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2937">1</text><rect x="100" y="48" width="40" height="40" rx="2" fill="#8e6bbf" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.5"/><text x="120" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2937">0</text><rect x="140" y="48" width="40" height="40" rx="2" fill="#8e6bbf" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.5"/><text x="160" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2937">1</text><rect x="180" y="48" width="40" height="40" rx="2" fill="#8e6bbf" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2937">1</text><rect x="220" y="48" width="40" height="40" rx="2" fill="#8e6bbf" fill-opacity="0.12" stroke="#4b5563" stroke-width="1.5"/><text x="240" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f2937">0</text><rect x="260" y="48" width="40" height="40" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="280" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#6b7280">·</text><rect x="300" y="48" width="40" height="40" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="320" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#6b7280">·</text><rect x="340" y="48" width="40" height="40" rx="2" fill="#fff" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="360" y="74" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="16" font-weight="normal" text-anchor="middle" fill="#6b7280">·</text><path d="M148.0,112 L172.0,112 L160.0,92 z" fill="#8e6bbf" stroke="#8e6bbf" stroke-width="1.5"/><text x="160" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">head</text><rect x="184" y="104" width="108" height="30" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="238" y="124" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">state: q2</text><line x1="184" y1="119" x2="174" y2="108" stroke="#4b5563" stroke-width="1.5"/><rect x="20" y="152" width="360" height="44" rx="6" fill="#8e6bbf" fill-opacity="0.08" stroke="#8e6bbf" stroke-width="1.5"/><text x="200" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">rule table (finite)</text><text x="200" y="187" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1f2937">in q2 reading 1 → write 0, move right, go to q3</text></svg>

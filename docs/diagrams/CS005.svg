<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Switching circuits as Boolean algebra</title><desc>Series switches act as AND, parallel switches as OR.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="95" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">in series</text><line x1="15" y1="52" x2="45" y2="52" stroke="#4b5563" stroke-width="1.5"/><circle cx="15" cy="52" r="3" fill="#4b5563" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><rect x="45" y="41" width="30" height="22" rx="3" fill="#fff" fill-opacity="1.0" stroke="#2f7fb0" stroke-width="1.8"/><text x="60" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2f7fb0">A</text><line x1="75" y1="52" x2="105" y2="52" stroke="#4b5563" stroke-width="1.5"/><rect x="105" y="41" width="30" height="22" rx="3" fill="#fff" fill-opacity="1.0" stroke="#2f7fb0" stroke-width="1.8"/><text x="120" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2f7fb0">B</text><line x1="135" y1="52" x2="170" y2="52" stroke="#4b5563" stroke-width="1.5"/><circle cx="172" cy="52" r="3" fill="#4b5563" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="95" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">current flows only if A and B</text><text x="95" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2f7fb0">are both closed:  A · B  (AND)</text><text x="95" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">in parallel</text><circle cx="15" cy="150" r="3" fill="#4b5563" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><circle cx="172" cy="150" r="3" fill="#4b5563" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><path d="M15,150 L28,150 L28,138 L65,138" fill="none" stroke="#4b5563" stroke-width="1.5"/><rect x="65" y="127" width="30" height="22" rx="3" fill="#fff" fill-opacity="1.0" stroke="#2f7fb0" stroke-width="1.8"/><text x="80" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2f7fb0">A</text><path d="M95,138 L148,138 L148,150 L172,150" fill="none" stroke="#4b5563" stroke-width="1.5"/><path d="M28,150 L28,162 L65,162" fill="none" stroke="#4b5563" stroke-width="1.5"/><rect x="65" y="151" width="30" height="22" rx="3" fill="#fff" fill-opacity="1.0" stroke="#2f7fb0" stroke-width="1.8"/><text x="80" y="167" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2f7fb0">B</text><path d="M95,162 L148,162 L148,150" fill="none" stroke="#4b5563" stroke-width="1.5"/><text x="95" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">current flows if A or B</text><text x="95" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2f7fb0">is closed:  A + B  (OR)</text><rect x="215" y="24" width="170" height="160" rx="6" fill="#2f7fb0" fill-opacity="0.07" stroke="#2f7fb0" stroke-width="1.5"/><text x="300" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Switch algebra</text><text x="228" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">closed = 1,  open = 0</text><text x="228" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">series = AND</text><text x="228" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">parallel = OR</text><text x="228" y="127" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">contact closed when</text><text x="228" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">the relay is off = NOT</text><text x="300" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2f7fb0">circuit ⇄ Boolean expression</text></svg>

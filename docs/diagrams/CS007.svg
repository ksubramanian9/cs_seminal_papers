<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The stored-program design</title><desc>Control and arithmetic units connected to one memory holding instructions and data.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="40" y="14" width="130" height="44" rx="6" fill="#6b6b6b" fill-opacity="0.1" stroke="#6b6b6b" stroke-width="1.5"/><text x="105" y="41" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">Control unit</text><rect x="230" y="14" width="130" height="44" rx="6" fill="#6b6b6b" fill-opacity="0.1" stroke="#6b6b6b" stroke-width="1.5"/><text x="295" y="41" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">Arithmetic unit</text><line x1="170" y1="36" x2="230" y2="36" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="230" y1="36" x2="170" y2="36" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="96" width="320" height="64" rx="6" fill="#fff" fill-opacity="1.0" stroke="#6b6b6b" stroke-width="2"/><text x="200" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#6b6b6b">Memory: one store of numbers</text><rect x="56" y="120" width="136" height="30" rx="6" fill="#eef2ff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.5"/><text x="124" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">instructions</text><rect x="208" y="120" width="136" height="30" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="276" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">data</text><line x1="105" y1="58" x2="105" y2="96" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="105" y1="96" x2="105" y2="58" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="295" y1="58" x2="295" y2="96" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="295" y1="96" x2="295" y2="58" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="178" width="100" height="26" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="90" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Input</text><rect x="260" y="178" width="100" height="26" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="310" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">Output</text><line x1="90" y1="178" x2="90" y2="160" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="310" y1="160" x2="310" y2="178" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/></svg>

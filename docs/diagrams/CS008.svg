<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Shannon’s model of communication</title><desc>Source, encoder, noisy channel, decoder, destination, with entropy and capacity.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="7" y="66" width="66" height="40" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="40" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Source</text><line x1="73" y1="86" x2="87" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="87" y="66" width="66" height="40" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="120" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Encoder</text><line x1="153" y1="86" x2="167" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="167" y="66" width="66" height="40" rx="6" fill="#b07aa1" fill-opacity="0.14" stroke="#b07aa1" stroke-width="1.5"/><text x="200" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Channel</text><line x1="233" y1="86" x2="247" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="247" y="66" width="66" height="40" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="280" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Decoder</text><line x1="313" y1="86" x2="327" y2="86" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="327" y="66" width="66" height="40" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="360" y="91" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Destination</text><rect x="170" y="10" width="60" height="24" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="200" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#b91c1c">Noise</text><line x1="200" y1="34" x2="200" y2="66" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/><text x="200" y="134" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#b07aa1">H = −Σ p · log₂ p   (average bits per message)</text><text x="200" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">compress a source down to about H bits, no further</text><text x="200" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">reliable communication is possible below capacity C</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">rarer message → more surprise → more information</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The imitation game</title><desc>An interrogator questions two hidden players, one human and one machine.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="12" y="70" width="110" height="70" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="67" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">Interrogator</text><text x="67" y="114.3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2937">(human judge)</text><path d="M200,22 L200,188" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/><text x="200" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">screen</text><rect x="288" y="28" width="100" height="52" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="338" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">Player A</text><text x="338" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4a5fc1">?</text><rect x="288" y="130" width="100" height="52" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="338" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">Player B</text><text x="338" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4a5fc1">?</text><line x1="122" y1="90" x2="288" y2="56" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="288" y1="62" x2="122" y2="96" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="122" y1="120" x2="288" y2="156" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="288" y1="150" x2="122" y2="114" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="194" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">typed questions</text><text x="194" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">typed answers</text><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#4a5fc1">one is a human, one is a machine; can the judge tell?</text></svg>

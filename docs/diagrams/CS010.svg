<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Dartmouth proposal</title><desc>A central goal with seven proposed research topics around it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><path d="M200,66 L200,24" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="139.8" y="13" width="120.4" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="200" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Automatic computers</text><path d="M229.71,80.3074 L315.711,54.1208" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="249.911" y="43.1208" width="131.6" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="315.711" y="58.1208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Programming languages</text><path d="M237.047,112.456 L344.289,121.802" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="306.489" y="110.802" width="75.6" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="344.289" y="125.802" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Neuron nets</text><path d="M216.488,138.237 L264.215,176.078" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="198.415" y="165.078" width="131.6" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="264.215" y="180.078" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Size of a computation</text><path d="M183.512,138.237 L135.785,176.078" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="83.9852" y="165.078" width="103.6" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="135.785" y="180.078" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Self-improvement</text><path d="M162.953,112.456 L55.7107,121.802" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="15.1107" y="110.802" width="81.2" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="55.7107" y="125.802" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Abstractions</text><path d="M170.29,80.3074 L84.2889,54.1208" fill="none" stroke="#cbd5e1" stroke-width="1.2"/><rect x="12.8889" y="43.1208" width="142.8" height="22" rx="11" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="1.2"/><text x="84.2889" y="58.1208" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">Randomness &amp; creativity</text><circle cx="200" cy="104" r="38" fill="#4a5fc1" fill-opacity="0.14" stroke="#4a5fc1" stroke-width="2"/><text x="200" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2937">simulate</text><text x="200" y="110.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2937">intelligence</text><text x="200" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2937">on a machine</text><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">seven topics proposed for a two-month summer study, 1956</text></svg>

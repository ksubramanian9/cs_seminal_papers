<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Dijkstra’s shortest path</title><desc>A small weighted map; distances settle in order of nearness and the shortest route is highlighted.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="392" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#6b7280">settled in order:</text><text x="392" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="end" fill="#6b7280">S, B, A, C, T  (S→T = 11)</text><line x1="40" y1="108" x2="140" y2="50" stroke="#9ca3af" stroke-width="1.4"/><line x1="40" y1="108" x2="140" y2="168" stroke="#d08a10" stroke-width="3.4"/><line x1="140" y1="168" x2="140" y2="50" stroke="#d08a10" stroke-width="3.4"/><line x1="140" y1="50" x2="260" y2="50" stroke="#d08a10" stroke-width="3.4"/><line x1="140" y1="168" x2="260" y2="50" stroke="#9ca3af" stroke-width="1.4"/><line x1="260" y1="50" x2="360" y2="108" stroke="#d08a10" stroke-width="3.4"/><line x1="140" y1="168" x2="360" y2="108" stroke="#9ca3af" stroke-width="1.4"/><circle cx="80" cy="71" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="80" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">4</text><circle cx="80" cy="146" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="80" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><circle cx="152" cy="109" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="152" y="113" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><circle cx="200" cy="38" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="200" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">5</text><circle cx="210" cy="111" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="210" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">8</text><circle cx="322" cy="71" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="322" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">3</text><circle cx="250" cy="150" r="9" fill="#fff" fill-opacity="1.0" stroke="none" stroke-width="0"/><text x="250" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">10</text><circle cx="40" cy="108" r="16" fill="#fff" fill-opacity="1.0" stroke="#d08a10" stroke-width="2.2"/><text x="40" y="113" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">S</text><text x="40" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d08a10">d = 0</text><circle cx="140" cy="50" r="16" fill="#fff" fill-opacity="1.0" stroke="#d08a10" stroke-width="2.2"/><text x="140" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">A</text><text x="140" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d08a10">d = 3</text><circle cx="140" cy="168" r="16" fill="#fff" fill-opacity="1.0" stroke="#d08a10" stroke-width="2.2"/><text x="140" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">B</text><text x="140" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d08a10">d = 2</text><circle cx="260" cy="50" r="16" fill="#fff" fill-opacity="1.0" stroke="#d08a10" stroke-width="2.2"/><text x="260" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">C</text><text x="260" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d08a10">d = 8</text><circle cx="360" cy="108" r="16" fill="#fff" fill-opacity="1.0" stroke="#d08a10" stroke-width="2.2"/><text x="360" y="113" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">T</text><text x="360" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#d08a10">d = 11</text></svg>

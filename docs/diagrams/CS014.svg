<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>LISP: code is data</title><desc>The list (A (B C)) as linked cells, a program written as a list, and an eval box that runs any such list.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="120" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#6b7280">the list (A (B C))</text><rect x="16" y="34" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><rect x="46" y="34" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><text x="31" y="53" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">A</text><circle cx="61" cy="48" r="3" fill="#d1603d" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.5"/><rect x="100" y="34" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><rect x="130" y="34" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><circle cx="115" cy="48" r="3" fill="#d1603d" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.5"/><line x1="134" y1="58" x2="156" y2="38" stroke="#d1603d" stroke-width="1.6"/><rect x="100" y="94" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><rect x="130" y="94" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><text x="115" y="113" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">B</text><circle cx="145" cy="108" r="3" fill="#d1603d" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.5"/><rect x="184" y="94" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><rect x="214" y="94" width="30" height="28" rx="3" fill="#fff" fill-opacity="1.0" stroke="#d1603d" stroke-width="1.6"/><text x="199" y="113" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">C</text><line x1="218" y1="118" x2="240" y2="98" stroke="#d1603d" stroke-width="1.6"/><line x1="61" y1="48" x2="100" y2="48" stroke="#d1603d" stroke-width="1.5" marker-end="url(#a)"/><line x1="115" y1="48" x2="115" y2="94" stroke="#d1603d" stroke-width="1.5" marker-end="url(#a)"/><line x1="145" y1="108" x2="184" y2="108" stroke="#d1603d" stroke-width="1.5" marker-end="url(#a)"/><text x="210" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">nil = slash</text><text x="330" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">a program</text><rect x="262" y="40" width="126" height="30" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="325" y="60" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2937">(+ 1 (* 2 3))</text><text x="325" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">is the same kind of list</text><line x1="325" y1="98" x2="325" y2="118" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="262" y="118" width="126" height="44" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="2"/><text x="325" y="136" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">eval</text><text x="325" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">runs any such list</text><text x="200" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#d1603d">code and data share one structure,</text><text x="200" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#d1603d">so programs can build and run programs</text></svg>

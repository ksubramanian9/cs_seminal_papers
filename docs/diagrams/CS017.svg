<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Sketchpad</title><desc>A constrained drawing edited with a light pen, and a master drawing with instances.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="14" y="16" width="196" height="156" rx="10" fill="#f9fafb" fill-opacity="1.0" stroke="#4b5563" stroke-width="2"/><path d="M48,140 L118,140 L164,78 L94,78 Z" fill="#6a8f2a22" stroke="#6a8f2a" stroke-width="2.6"/><text x="106" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6a8f2a">=</text><text x="83" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6a8f2a">=</text><text x="60" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d1603d">∥</text><text x="150" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d1603d">∥</text><circle cx="164" cy="78" r="4.5" fill="#6a8f2a" fill-opacity="1.0" stroke="#6a8f2a" stroke-width="1.5"/><path d="M168,74 L236,22" fill="none" stroke="#4b5563" stroke-width="5"/><path d="M168,74 L236,22" fill="none" stroke="#d1d5db" stroke-width="2"/><text x="236" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">light pen</text><text x="112" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">constraints keep the shape as you drag</text><text x="322" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">master</text><rect x="300" y="46" width="44" height="26" rx="6" fill="#6a8f2a" fill-opacity="0.16" stroke="#6a8f2a" stroke-width="1.5"/><rect x="240" y="118" width="24" height="16" rx="6" fill="#6a8f2a" fill-opacity="0.1" stroke="#6a8f2a" stroke-width="1.4"/><line x1="322" y1="74" x2="252" y2="108" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/><rect x="293" y="115" width="34" height="22" rx="6" fill="#6a8f2a" fill-opacity="0.1" stroke="#6a8f2a" stroke-width="1.4"/><line x1="322" y1="74" x2="310" y2="108" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/><rect x="346" y="112" width="44" height="28" rx="6" fill="#6a8f2a" fill-opacity="0.1" stroke="#6a8f2a" stroke-width="1.4"/><line x1="322" y1="74" x2="368" y2="108" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/><text x="322" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">instances: change the master,</text><text x="322" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">every copy follows</text><text x="322" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#6a8f2a">draw · constrain · reuse</text></svg>

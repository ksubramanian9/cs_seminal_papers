<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The fast Fourier transform</title><desc>A transform split recursively into halves, and the step counts for the direct and fast methods.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="40" y="14" width="120" height="32" rx="6" fill="#d08a10" fill-opacity="0.14" stroke="#d08a10" stroke-width="1.5"/><text x="100" y="35" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">n-point transform</text><line x1="80" y1="46" x2="56" y2="74" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="120" y1="46" x2="144" y2="74" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="8" y="74" width="96" height="34" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="56" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">n/2 points</text><text x="56" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">(even samples)</text><rect x="112" y="74" width="96" height="34" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="160" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">n/2 points</text><text x="160" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">(odd samples)</text><line x1="56" y1="108" x2="56" y2="128" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><line x1="160" y1="108" x2="160" y2="128" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="108" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">…split again, and again…</text><rect x="40" y="154" width="136" height="32" rx="6" fill="#d08a10" fill-opacity="0.08" stroke="#d08a10" stroke-width="1.5"/><text x="108" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">then combine the halves</text><text x="108" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">with a few multiplications</text><text x="300" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">for n = 1,024 samples</text><text x="232" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">direct: n²</text><rect x="232" y="64" width="156" height="18" rx="3" fill="#6b7280" fill-opacity="0.35" stroke="#6b7280" stroke-width="1.5"/><text x="310" y="77" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1f2937">1,048,576 steps</text><text x="232" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#d08a10">FFT: n log₂ n</text><rect x="232" y="118" width="2" height="18" rx="1" fill="#d08a10" fill-opacity="1.0" stroke="#d08a10" stroke-width="1.5"/><text x="240" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#d08a10">10,240 steps</text><text x="310" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#d08a10">about 100× fewer,</text><text x="310" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">and the gap widens with n</text></svg>

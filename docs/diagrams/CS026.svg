<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Hoare logic</title><desc>A precondition, a program statement and a postcondition, with a worked example and the proof rules.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="62" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">before</text><text x="200" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">statement</text><text x="338" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">after</text><rect x="12" y="36" width="100" height="44" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="62" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">precondition</text><text x="62" y="72" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">P</text><rect x="150" y="36" width="100" height="44" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">program</text><text x="200" y="72" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">S</text><rect x="288" y="36" width="100" height="44" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="338" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">postcondition</text><text x="338" y="72" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">Q</text><line x1="112" y1="58" x2="150" y2="58" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><line x1="250" y1="58" x2="288" y2="58" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/><text x="200" y="108" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">{ x &gt; 0 }   y := x + 1   { y &gt; 1 }</text><text x="200" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">if P holds before and S finishes, Q holds after</text><rect x="30" y="140" width="340" height="56" rx="6" fill="#d1603d" fill-opacity="0.07" stroke="#d1603d" stroke-width="1.5"/><text x="200" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#d1603d">rules for each construct</text><text x="200" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">assignment · sequence · choice · loop</text><text x="200" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">a loop needs an invariant: true on every pass</text></svg>

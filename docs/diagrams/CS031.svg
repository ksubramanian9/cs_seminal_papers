<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Karp’s web of NP-complete problems</title><desc>Arrows of reduction from satisfiability to a sample of the twenty-one problems.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><line x1="200" y1="29" x2="200" y2="37" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="59" x2="66" y2="77" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="59" x2="200" y2="77" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="200" y1="59" x2="334" y2="77" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="66" y1="99" x2="66" y2="113" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="66" y1="135" x2="66" y2="149" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><line x1="334" y1="99" x2="334" y2="113" stroke="#d08a10" stroke-width="1.6" marker-end="url(#a)"/><rect x="158" y="7" width="84" height="22" rx="6" fill="#d08a10" fill-opacity="0.22" stroke="#d08a10" stroke-width="1.6"/><text x="200" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">SAT</text><rect x="158" y="37" width="84" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="200" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">3-SAT</text><rect x="24" y="77" width="84" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="66" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Clique</text><rect x="148" y="77" width="104" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="200" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Chromatic number</text><rect x="292" y="77" width="84" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="334" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Exact cover</text><rect x="24" y="113" width="84" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="66" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Vertex cover</text><rect x="14" y="149" width="104" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="66" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Hamilton circuit</text><rect x="292" y="113" width="84" height="22" rx="6" fill="#fff" fill-opacity="1" stroke="#d08a10" stroke-width="1.6"/><text x="334" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">Knapsack</text><text x="284" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">… 21 problems in all,</text><text x="284" y="173" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">scheduling, packing,</text><text x="284" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#6b7280">routing, covering …</text><text x="200" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">A → B: a fast method for B would give one for A</text></svg>

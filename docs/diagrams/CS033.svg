<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>UNIX: files and pipes</title><desc>A pipeline of three small programs and a single hierarchy of files.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="20" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">grep error log | sort | uniq -c</text><rect x="30" y="34" width="84" height="36" rx="6" fill="#a0783c" fill-opacity="0.12" stroke="#a0783c" stroke-width="1.5"/><text x="72" y="52" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">grep</text><text x="72" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">find lines</text><line x1="114" y1="52" x2="158" y2="52" stroke="#a0783c" stroke-width="2" marker-end="url(#a)"/><text x="136" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">pipe</text><rect x="158" y="34" width="84" height="36" rx="6" fill="#a0783c" fill-opacity="0.12" stroke="#a0783c" stroke-width="1.5"/><text x="200" y="52" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">sort</text><text x="200" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">order them</text><line x1="242" y1="52" x2="286" y2="52" stroke="#a0783c" stroke-width="2" marker-end="url(#a)"/><text x="264" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">pipe</text><rect x="286" y="34" width="84" height="36" rx="6" fill="#a0783c" fill-opacity="0.12" stroke="#a0783c" stroke-width="1.5"/><text x="328" y="52" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">uniq</text><text x="328" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">count repeats</text><text x="200" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">small tools, one job each, joined by pipes</text><rect x="84" y="104" width="24" height="18" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="96" y="117" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">/</text><rect x="14" y="150" width="42" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="35" y="164" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">bin</text><line x1="96" y1="122" x2="35" y2="150" stroke="#4b5563" stroke-width="1.2"/><rect x="62" y="150" width="42" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="83" y="164" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">usr</text><line x1="96" y1="122" x2="83" y2="150" stroke="#4b5563" stroke-width="1.2"/><rect x="110" y="150" width="42" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="131" y="164" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">dev</text><line x1="96" y1="122" x2="131" y2="150" stroke="#4b5563" stroke-width="1.2"/><rect x="158" y="150" width="42" height="20" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="179" y="164" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">home</text><line x1="96" y1="122" x2="179" y2="150" stroke="#4b5563" stroke-width="1.2"/><text x="100" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">one hierarchy of files</text><text x="298" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a0783c">everything is a file</text><text x="298" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">disks, terminals and even</text><text x="298" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">other programs’ output</text><text x="298" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">are plain streams of bytes</text></svg>

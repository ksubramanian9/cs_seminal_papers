<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Saltzer and Schroeder’s design principles</title><desc>Eight tiles naming the design principles, with fail-safe defaults highlighted.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">eight design principles for protection</text><rect x="8" y="26" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="102" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Economy of mechanism</text><text x="102" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">small and simple</text><rect x="8" y="67" width="188" height="36" rx="6" fill="#c2476b" fill-opacity="0.18" stroke="#c2476b" stroke-width="2"/><text x="102" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Fail-safe defaults</text><text x="102" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">default: deny</text><rect x="8" y="108" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="102" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Complete mediation</text><text x="102" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">check every access</text><rect x="8" y="149" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="102" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Open design</text><text x="102" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">not a secret design</text><rect x="204" y="26" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="298" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Separation of privilege</text><text x="298" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">two keys beat one</text><rect x="204" y="67" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="298" y="83" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Least privilege</text><text x="298" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">only what is needed</text><rect x="204" y="108" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="298" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Least common mechanism</text><text x="298" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">share as little as possible</text><rect x="204" y="149" width="188" height="36" rx="6" fill="#f3f4f6" fill-opacity="1" stroke="#4b5563" stroke-width="1.5"/><text x="298" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Psychological acceptability</text><text x="298" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">easy to use right</text><text x="200" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">assume the attacker knows the design; give no one more than they need</text></svg>

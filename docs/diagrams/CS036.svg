<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Symbols and search</title><desc>The three parts of a physical symbol system beside a search tree with pruned branches and one path to the goal.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="76" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">a physical symbol system</text><rect x="8" y="26" width="136" height="40" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="76" y="43" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Symbols</text><text x="76" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">patterns that stand for things</text><line x1="76" y1="66" x2="76" y2="78" stroke="#4a5fc1" stroke-width="1.5" marker-end="url(#a)"/><rect x="8" y="78" width="136" height="40" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="76" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Expressions</text><text x="76" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">structures built from symbols</text><line x1="76" y1="118" x2="76" y2="130" stroke="#4a5fc1" stroke-width="1.5" marker-end="url(#a)"/><rect x="8" y="130" width="136" height="40" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="76" y="147" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">Processes</text><text x="76" y="161" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">create and transform them</text><text x="76" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#4a5fc1" font-style="italic">enough for general intelligence?</text><text x="286" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">heuristic search</text><line x1="286" y1="34" x2="222" y2="80" stroke="#9ca3af" stroke-width="1.3"/><line x1="286" y1="34" x2="286" y2="80" stroke="#4a5fc1" stroke-width="3"/><line x1="286" y1="34" x2="350" y2="80" stroke="#9ca3af" stroke-width="1.3"/><line x1="286" y1="80" x2="252" y2="126" stroke="#9ca3af" stroke-width="1.3"/><line x1="286" y1="80" x2="320" y2="126" stroke="#4a5fc1" stroke-width="3"/><line x1="320" y1="126" x2="320" y2="172" stroke="#4a5fc1" stroke-width="3"/><circle cx="286" cy="34" r="7" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="2"/><circle cx="222" cy="80" r="7" fill="#fff" fill-opacity="1.0" stroke="#9ca3af" stroke-width="1.3"/><circle cx="286" cy="80" r="7" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="2"/><circle cx="350" cy="80" r="7" fill="#fff" fill-opacity="1.0" stroke="#9ca3af" stroke-width="1.3"/><circle cx="252" cy="126" r="7" fill="#fff" fill-opacity="1.0" stroke="#9ca3af" stroke-width="1.3"/><circle cx="320" cy="126" r="7" fill="#fff" fill-opacity="1.0" stroke="#4a5fc1" stroke-width="2"/><circle cx="320" cy="172" r="10" fill="#fbbf24" fill-opacity="1.0" stroke="#b45309" stroke-width="1.6"/><text x="320" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle" fill="#1f2937">goal</text><text x="222" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">×</text><text x="350" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">×</text><text x="252" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#b91c1c">×</text><text x="286" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#4a5fc1">follow promising branches, drop the rest</text></svg>

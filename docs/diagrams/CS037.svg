<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Diffie–Hellman key exchange as paint mixing</title><desc>Two people mix private colours with a common colour, swap mixtures, add their own secret and share a colour.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="200" cy="28" r="12" fill="#f5c518" fill-opacity="1.0" stroke="#b8860b" stroke-width="1.5"/><text x="222" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b7280">common colour (public)</text><circle cx="70" cy="74" r="13" fill="#d1242f" fill-opacity="1.0" stroke="#d1242f" stroke-width="1.5"/><text x="70" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">Alice’s secret</text><circle cx="330" cy="74" r="13" fill="#2563eb" fill-opacity="1.0" stroke="#2563eb" stroke-width="1.5"/><text x="330" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">Bob’s secret</text><circle cx="70" cy="128" r="13" fill="#e8743b" fill-opacity="1.0" stroke="#e8743b" stroke-width="1.5"/><circle cx="330" cy="128" r="13" fill="#2a9d8f" fill-opacity="1.0" stroke="#2a9d8f" stroke-width="1.5"/><line x1="70" y1="100" x2="70" y2="114" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="330" y1="100" x2="330" y2="114" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><line x1="190" y1="36" x2="82" y2="118" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#a)"/><line x1="210" y1="36" x2="318" y2="118" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#a)"/><circle cx="70" cy="180" r="13" fill="#7c4a2d" fill-opacity="1.0" stroke="#7c4a2d" stroke-width="1.5"/><circle cx="330" cy="180" r="13" fill="#7c4a2d" fill-opacity="1.0" stroke="#7c4a2d" stroke-width="1.5"/><line x1="84" y1="135" x2="316" y2="174" stroke="#c2476b" stroke-width="1.6" marker-end="url(#a)"/><line x1="316" y1="135" x2="84" y2="174" stroke="#c2476b" stroke-width="1.6" marker-end="url(#a)"/><text x="200" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c2476b">mixtures sent in public</text><text x="70" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">+ own secret</text><text x="330" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">+ own secret</text><text x="200" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#7c4a2d">= same colour</text></svg>

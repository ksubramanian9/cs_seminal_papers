<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Smalltalk: objects and messages</title><desc>Three objects, the number 3, a pen and a window, each receiving a message and responding.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="28" y="26" width="84" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="70" y="43" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#d1603d">+ 4</text><text x="70" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">message</text><line x1="70" y1="52" x2="70" y2="78" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><rect x="28" y="78" width="84" height="40" rx="10" fill="#d1603d" fill-opacity="0.14" stroke="#d1603d" stroke-width="2"/><text x="70" y="103" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">3</text><line x1="70" y1="118" x2="70" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><rect x="28" y="142" width="84" height="24" rx="12" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="70" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">7</text><rect x="158" y="26" width="84" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="43" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#d1603d">go: 10</text><text x="200" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">message</text><line x1="200" y1="52" x2="200" y2="78" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><rect x="158" y="78" width="84" height="40" rx="10" fill="#d1603d" fill-opacity="0.14" stroke="#d1603d" stroke-width="2"/><text x="200" y="103" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">pen</text><line x1="200" y1="118" x2="200" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><rect x="158" y="142" width="84" height="24" rx="12" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="200" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">line drawn</text><rect x="288" y="26" width="84" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="330" y="43" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#d1603d">show</text><text x="330" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">message</text><line x1="330" y1="52" x2="330" y2="78" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><rect x="288" y="78" width="84" height="40" rx="10" fill="#d1603d" fill-opacity="0.14" stroke="#d1603d" stroke-width="2"/><text x="330" y="103" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">window</text><line x1="330" y1="118" x2="330" y2="142" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/><rect x="288" y="142" width="84" height="24" rx="12" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="330" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">opens</text><text x="200" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#d1603d">each object decides how to answer</text><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">everything is an object; computing is sending messages</text></svg>

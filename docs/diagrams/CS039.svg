f" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">name</text><line x1="40" y1="65" x2="70" y2="104" stroke="#4b5563" stroke-width="1.2"/><ellipse cx="100" cy="52" rx="34" ry="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.4"/><text x="100" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">salary</text><line x1="100" y1="65" x2="70" y2="104" stroke="#4b5563" stroke-width="1.2"/><ellipse cx="298" cy="52" rx="28" ry="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.4"/><text x="298" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">name</text><line x1="298" y1="65" x2="330" y2="104" stroke="#4b5563" stroke-width="1.2"/><ellipse cx="362" cy="52" rx="34" ry="13" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.4"/><text x="362" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">location</text><line x1="362" y1="65" x2="330" y2="104" stroke="#4b5563" stroke-width="1.2"/><text x="70" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">entities</text><text x="200" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">relationships</text><text x="330" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">attributes on each</text><text x="200" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#2f7fb0">many employees work in
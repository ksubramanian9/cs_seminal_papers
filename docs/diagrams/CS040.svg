<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>RSA with small numbers</title><desc>Public and private keys from two primes, and a message encrypted and decrypted again.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="22" width="150" height="52" rx="6" fill="#c2476b" fill-opacity="0.1" stroke="#c2476b" stroke-width="1.5"/><text x="83" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#c2476b">public key</text><text x="83" y="54" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">n = 61 × 53 = 3233</text><text x="83" y="68" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">e = 17</text><rect x="242" y="22" width="150" height="52" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="317" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">private key</text><text x="317" y="54" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#1f2937">d = 2753</text><text x="317" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">(needs 61 and 53)</text><rect x="8" y="104" width="84" height="34" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="50" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">message</text><text x="50" y="132" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">m = 65</text><line x1="92" y1="121" x2="158" y2="121" stroke="#c2476b" stroke-width="1.8" marker-end="url(#a)"/><text x="125" y="114" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#c2476b">m^17 mod n</text><rect x="158" y="104" width="84" height="34" rx="6" fill="#c2476b" fill-opacity="0.14" stroke="#c2476b" stroke-width="1.5"/><text x="200" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">ciphertext</text><text x="200" y="132" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">c = 2790</text><line x1="242" y1="121" x2="308" y2="121" stroke="#c2476b" stroke-width="1.8" marker-end="url(#a)"/><text x="275" y="114" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#c2476b">c^d mod n</text><rect x="308" y="104" width="84" height="34" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="350" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">message</text><text x="350" y="132" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">m = 65</text><text x="200" y="168" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">easy: 61 × 53 = 3233</text><text x="200" y="186" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" fill="#c2476b">hard: split a 600-digit n back into its two primes</text><text x="200" y="204" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">anyone can encrypt; only the holder of d can decrypt</text></svg>

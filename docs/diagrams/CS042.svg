<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Lamport’s logical clocks</title><desc>Three process timelines with stamped events and two messages showing happened-before.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><line x1="40" y1="44" x2="388" y2="44" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="22" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">P1</text><line x1="40" y1="100" x2="388" y2="100" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="22" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">P2</text><line x1="40" y1="156" x2="388" y2="156" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/><text x="22" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">P3</text><line x1="170" y1="44" x2="230" y2="100" stroke="#2aa6a6" stroke-width="2" marker-end="url(#a)"/><line x1="290" y1="100" x2="350" y2="156" stroke="#2aa6a6" stroke-width="2" marker-end="url(#a)"/><circle cx="90" cy="44" r="6" fill="#fff" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="90" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><circle cx="170" cy="44" r="6" fill="#2aa6a6" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="170" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><circle cx="70" cy="100" r="6" fill="#fff" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="70" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><circle cx="230" cy="100" r="6" fill="#2aa6a6" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="230" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">3</text><circle cx="290" cy="100" r="6" fill="#2aa6a6" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="290" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">4</text><circle cx="120" cy="156" r="6" fill="#fff" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="120" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><circle cx="350" cy="156" r="6" fill="#2aa6a6" fill-opacity="1.0" stroke="#2aa6a6" stroke-width="2"/><text x="350" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">5</text><text x="200" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">a logical clock stamp on every event</text><text x="200" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">cause and effect: 1 → 2 → 3 → 4 → 5, the stamps respect it</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">the three events stamped 1 are concurrent: no order between them</text></svg>

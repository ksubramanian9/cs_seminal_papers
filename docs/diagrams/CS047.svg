<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Structure and Interpretation of Computer Programs</title><desc>Three methods of controlling complexity, a short Scheme program and an eval and apply loop.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="12" width="120" height="40" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="68" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">primitives</text><text x="68" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">numbers, +, ×</text><line x1="128" y1="32" x2="142" y2="32" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="142" y="12" width="120" height="40" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="202" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">combination</text><text x="202" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">(f x y), if</text><line x1="262" y1="32" x2="276" y2="32" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/><rect x="276" y="12" width="120" height="40" rx="6" fill="#d1603d" fill-opacity="0.1" stroke="#d1603d" stroke-width="1.5"/><text x="336" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">abstraction</text><text x="336" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">define a procedure</text><rect x="8" y="72" width="196" height="62" rx="6" fill="#f9fafb" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="16" y="90" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">(define (square x)</text><text x="16" y="107" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">  (* x x))</text><text x="16" y="124" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="start" fill="#1f2937">(map square '(1 2 3))</text><text x="106" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">procedures are values</text><circle cx="262" cy="102" r="22" fill="#d1603d" fill-opacity="0.14" stroke="#d1603d" stroke-width="2"/><text x="262" y="106" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">eval</text><circle cx="352" cy="102" r="22" fill="#d1603d" fill-opacity="0.14" stroke="#d1603d" stroke-width="2"/><text x="352" y="106" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">apply</text><path d="M280,88 C300,74 314,74 334,88" fill="none" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><path d="M334,116 C314,130 300,130 280,116" fill="none" stroke="#d1603d" stroke-width="1.8" marker-end="url(#a)"/><text x="307" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">an interpreter written</text><text x="307" y="163" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">in the language it runs</text><text x="200" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#d1603d">learn what programs are, not only how to write them</text></svg>

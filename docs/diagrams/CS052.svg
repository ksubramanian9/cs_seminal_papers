<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The quantitative approach</title><desc>The performance equation and a bar showing most run time is in the common case.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="14" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">execution time =</text><rect x="8" y="22" width="104" height="36" rx="6" fill="#6b6b6b" fill-opacity="0.1" stroke="#6b6b6b" stroke-width="1.5"/><text x="60" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">instructions</text><text x="60" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">per program</text><rect x="146" y="22" width="116" height="36" rx="6" fill="#6b6b6b" fill-opacity="0.1" stroke="#6b6b6b" stroke-width="1.5"/><text x="204" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">cycles</text><text x="204" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">per instruction</text><rect x="296" y="22" width="96" height="36" rx="6" fill="#6b6b6b" fill-opacity="0.1" stroke="#6b6b6b" stroke-width="1.5"/><text x="344" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">seconds</text><text x="344" y="51" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">per cycle</text><text x="129" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">×</text><text x="279" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">×</text><text x="200" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">where the time goes in typical programs</text><rect x="50" y="98" width="240" height="30" rx="6" fill="#6b6b6b" fill-opacity="0.3" stroke="#6b6b6b" stroke-width="2"/><text x="170" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">the common case: 80%</text><rect x="290" y="98" width="60" height="30" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="320" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">rare: 20%</text><line x1="170" y1="156" x2="170" y2="132" stroke="#047857" stroke-width="2.4" marker-end="url(#a)"/><text x="170" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#047857">speed this up first</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#6b6b6b">measure real programs, then decide what is worth building</text></svg>

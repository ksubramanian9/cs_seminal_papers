<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Design patterns</title><desc>A pattern card with four parts beside the Observer pattern, where a subject notifies its observers.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="14" width="172" height="156" rx="6" fill="#f9fafb" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="94" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">a design pattern</text><rect x="14" y="44" width="160" height="27" rx="3" fill="#3f8f6b" fill-opacity="0.08" stroke="#3f8f6b" stroke-width="1.2"/><text x="20" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#3f8f6b">Name</text><text x="20" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1f2937">Observer</text><rect x="14" y="75" width="160" height="27" rx="3" fill="#3f8f6b" fill-opacity="0.08" stroke="#3f8f6b" stroke-width="1.2"/><text x="20" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#3f8f6b">Problem</text><text x="20" y="97" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1f2937">many parts react to one change</text><rect x="14" y="106" width="160" height="27" rx="3" fill="#3f8f6b" fill-opacity="0.08" stroke="#3f8f6b" stroke-width="1.2"/><text x="20" y="117" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#3f8f6b">Solution</text><text x="20" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1f2937">the subject notifies observers</text><rect x="14" y="137" width="160" height="27" rx="3" fill="#3f8f6b" fill-opacity="0.08" stroke="#3f8f6b" stroke-width="1.2"/><text x="20" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="start" fill="#3f8f6b">Consequences</text><text x="20" y="159" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1f2937">loose coupling; updates may cascade</text><rect x="250" y="20" width="84" height="26" rx="6" fill="#3f8f6b" fill-opacity="0.2" stroke="#3f8f6b" stroke-width="1.8"/><text x="292" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Subject</text><rect x="209" y="104" width="54" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="236" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">observer</text><line x1="292" y1="46" x2="236" y2="104" stroke="#3f8f6b" stroke-width="1.6" marker-end="url(#a)"/><rect x="265" y="104" width="54" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="292" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">observer</text><line x1="292" y1="46" x2="292" y2="104" stroke="#3f8f6b" stroke-width="1.6" marker-end="url(#a)"/><rect x="321" y="104" width="54" height="24" rx="3" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="348" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1f2937">observer</text><line x1="292" y1="46" x2="348" y2="104" stroke="#3f8f6b" stroke-width="1.6" marker-end="url(#a)"/><text x="292" y="12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle" fill="#3f8f6b" font-style="italic">when its state changes, it notifies:</text><text x="292" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">the subject does not know</text><text x="292" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">what its observers do</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">a named, proven solution; the idea comes from architecture</text></svg>

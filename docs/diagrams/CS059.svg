<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Extreme Programming practices</title><desc>Six practices around a centre labelled short feedback loops.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><circle cx="200" cy="104" r="40" fill="#3f8f6b" fill-opacity="0.16" stroke="#3f8f6b" stroke-width="2.4"/><text x="200" y="99" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">short</text><text x="200" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">feedback</text><text x="200" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">loops</text><rect x="142" y="7" width="116" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.6"/><text x="200" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">pair programming</text><line x1="200" y1="34" x2="200" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="264" y="49" width="116" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.6"/><text x="322" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">tests first</text><line x1="303.089" y1="66.5572" x2="241.604" y2="89.6774" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="264" y="133" width="116" height="26" rx="13" fill="#fff" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.6"/><text x="322" y="150
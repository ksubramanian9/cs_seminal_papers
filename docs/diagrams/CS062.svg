<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>The Google File System</title><desc>A client asks the master where a chunk is, then reads from chunkservers that each hold copies of chunks.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="150" y="8" width="100" height="30" rx="6" fill="#2aa6a6" fill-opacity="0.16" stroke="#2aa6a6" stroke-width="2"/><text x="200" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Master</text><text x="200" y="33" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#6b7280">metadata only</text><rect x="8" y="84" width="64" height="30" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.8"/><text x="40" y="103" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">Client</text><line x1="72" y1="90" x2="150" y2="30" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="88" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">where is it?</text><rect x="110" y="128" width="84" height="46" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="152" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">chunkserver</text><rect x="120" y="148" width="28" height="20" rx="3" fill="#d1603d" fill-opacity="0.35" stroke="#d1603d" stroke-width="1.5"/><text x="134" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">A</text><rect x="156" y="148" width="28" height="20" rx="3" fill="#2f7fb0" fill-opacity="0.35" stroke="#2f7fb0" stroke-width="1.5"/><text x="170" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">B</text><rect x="200" y="128" width="84" height="46" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="242" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">chunkserver</text><rect x="210" y="148" width="28" height="20" rx="3" fill="#d1603d" fill-opacity="0.35" stroke="#d1603d" stroke-width="1.5"/><text x="224" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">A</text><rect x="246" y="148" width="28" height="20" rx="3" fill="#6a8f2a" fill-opacity="0.35" stroke="#6a8f2a" stroke-width="1.5"/><text x="260" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">C</text><rect x="290" y="128" width="84" height="46" rx="6" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.6"/><text x="332" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">chunkserver</text><rect x="300" y="148" width="28" height="20" rx="3" fill="#2f7fb0" fill-opacity="0.35" stroke="#2f7fb0" stroke-width="1.5"/><text x="314" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">B</text><rect x="336" y="148" width="28" height="20" rx="3" fill="#6a8f2a" fill-opacity="0.35" stroke="#6a8f2a" stroke-width="1.5"/><text x="350" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">C</text><line x1="60" y1="114" x2="200" y2="128" stroke="#2aa6a6" stroke-width="2" marker-end="url(#a)"/><text x="84" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#2aa6a6">then data flows directly</text><text x="330" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">chunks of 64 MB,</text><text x="330" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">each on three machines</text><text x="330" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">a machine dies:</text><text x="330" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">copy it again</text><text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#2aa6a6">failure is normal; cheap machines, many replicas</text></svg>

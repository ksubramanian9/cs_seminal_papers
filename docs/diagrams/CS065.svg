L256,122.7 L260,127.1 L264,130.9 L268,134.4 L272,137.3 L276,139.8 L280,142.0 L284,143.7 L288,145.2 L292,146.3 L296,147.2 L300,147.9 L304,148.5 L308,148.9 L312,149.2 L316,149.4 L320,149.6 L324,149.7 L328,149.8 L332,149.9 L336,149.9 L340,149.9 L344,150.0 L348,150.0 L352,150.0 L356,150.0 L360,150.0 L364,150.0" fill="none" stroke="#e8743b" stroke-width="2.6" stroke-dasharray="6 4"/><text x="200" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">possible noisy answers</text><rect x="8" y="8" width="8" height="8" rx="1" fill="#c2476b" fill-opacity="1.0" stroke="#c2476b" stroke-width="1.5"/><text x="22" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1f2937">if your data is in</text><rect x="130" y="8" width="8" height="8" rx="1" fill="#e8743b" fill-opacity="1.0" stroke="#e8743b" stroke-width="1.5"/><text x="144" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#1f2937">if it is not</text><text x="200" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#6b7280" font-style="italic">almost the same: nobody’s presence changes the output much</text><text x="200" y="186" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c2476b">Pr[answer ∈ S]  ≤  e^ε × Pr[answer′ ∈ S]</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">ε is the privacy budget: smaller ε, more noise, more privacy</text></svg>

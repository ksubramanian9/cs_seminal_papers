<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>AlexNet</title><desc>A convolutional network from photo to a thousand classes, with a bar chart of its 2012 ImageNet error.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="34" width="56" height="56" rx="6" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.8"/><rect x="18" y="46" width="36" height="14" rx="2" fill="#bfdbfe" fill-opacity="1.0" stroke="none" stroke-width="1.5"/><rect x="18" y="66" width="36" height="14" rx="2" fill="#fde68a" fill-opacity="1.0" stroke="none" stroke-width="1.5"/><text x="36" y="108" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">photo</text><rect x="82" y="28" width="18" height="74" rx="2" fill="#4a5fc1" fill-opacity="0.22" stroke="#4a5fc1" stroke-width="1.6"/><line x1="64" y1="62" x2="82" y2="62" stroke="#9ca3af" stroke-width="1"/><rect x="106" y="34" width="18" height="62" rx="2" fill="#4a5fc1" fill-opacity="0.22" stroke="#4a5fc1" stroke-width="1.6"/><line x1="102" y1="62" x2="106" y2="62" stroke="#9ca3af" stroke-width="1"/><rect x="130" y="40" width="18" height="50" rx="2" fill="#4a5fc1" fill-opacity="0.22" stroke="#4a5fc1" stroke-width="1.6"/><line x1="126" y1="62" x2="130" y2="62" stroke="#9ca3af" stroke-width="1"/><rect x="154" y="44" width="18" height="42" rx="2" fill="#4a5fc1" fill-opacity="0.22" stroke="#4a5fc1" stroke-width="1.6"/><line x1="150" y1="62" x2="154" y2="62" stroke="#9ca3af" stroke-width="1"/><rect x="178" y="48" width="18" height="34" rx="2" fill="#4a5fc1" fill-opacity="0.22" stroke="#4a5fc1" stroke-width="1.6"/><line x1="174" y1="62" x2="178" y2="62" stroke="#9ca3af" stroke-width="1"/><text x="130" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">5 convolutional layers</text><text x="130" y="127" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="normal" text-anchor="middle" fill="#6b7280">learn the filters</text><rect x="214" y="36" width="12" height="56" rx="2" fill="#4a5fc1" fill-opacity="0.12" stroke="#4a5fc1" stroke-width="1.5"/><rect x="232" y="36" width="12" height="56" rx="2" fill="#4a5fc1" fill-opacity="0.12" stroke="#4a5fc1" stroke-width="1.5"/><rect x="250" y="36" width="12" height="56" rx="2" fill="#4a5fc1" fill-opacity="0.12" stroke="#4a5fc1" stroke-width="1.5"/><text x="238" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">3 fully connected</text><rect x="290" y="44" width="12" height="40" rx="2" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="346" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#6b7280">1,000 classes</text><line x1="262" y1="64" x2="290" y2="64" stroke="#9ca3af" stroke-width="1"/><text x="346" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">tricks: ReLU,</text><text x="346" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">dropout, data</text><text x="346" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">augmentation,</text><text x="346" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">2 GPUs</text><text x="160" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280">2012 ImageNet top-5 error (lower is better)</text><text x="128" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#4a5fc1">AlexNet</text><rect x="134" y="146" width="61.2" height="14" rx="2" fill="#4a5fc1" fill-opacity="0.5" stroke="#4a5fc1" stroke-width="1.5"/><text x="201.2" y="157" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">15.3%</text><text x="128" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="end" fill="#6b7280">runner-up</text><rect x="134" y="168" width="104.8" height="14" rx="2" fill="#d1d5db" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="244.8" y="179" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#6b7280">26.2%</text><text x="200" y="203" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">features learned from the data, not designed by hand</text></svg>

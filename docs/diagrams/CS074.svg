<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>Error budgets in SRE</title><desc>A reliability target, its error budget, and what happens when the budget is left or spent.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><text x="200" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">target: 99.9% of requests succeed (the SLO)</text><text x="200" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">the 0.1% left over is the error budget</text><rect x="40" y="48" width="320" height="28" rx="3" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.6"/><rect x="40" y="48" width="190" height="28" rx="3" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.6"/><text x="135" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#047857">budget left</text><text x="295" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#b91c1c">budget spent</text><rect x="20" y="96" width="172" height="44" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="106" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">budget left:</text><text x="106" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">release features freely</text><rect x="208" y="96" width="172" height="44" rx="6" fill="#fef2f2" fill-opacity="1.0" stroke="#b91c1c" stroke-width="1.5"/><text x="294" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">budget spent:</text><text x="294" y="129" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1f2937">slow down, fix reliability</text><text x="200" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">toil (routine manual work): at most half an engineer’s time</text><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3f8f6b">one shared number settles speed versus stability</text></svg>

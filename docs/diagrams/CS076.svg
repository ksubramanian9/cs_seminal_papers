<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>BERT: masked language modelling</title><desc>A sentence with two masked words read in both directions by an encoder that predicts them, then fine-tuning.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="18" y="14" width="56" height="24" rx="4" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="46" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">The</text><line x1="46" y1="38" x2="46" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="82" y="14" width="56" height="24" rx="4" fill="#fde68a" fill-opacity="1.0" stroke="#b45309" stroke-width="1.5"/><text x="110" y="30" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">[MASK]</text><line x1="110" y1="38" x2="110" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="146" y="14" width="56" height="24" rx="4" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="174" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">sat</text><line x1="174" y1="38" x2="174" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="210" y="14" width="56" height="24" rx="4" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="238" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">on</text><line x1="238" y1="38" x2="238" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="274" y="14" width="56" height="24" rx="4" fill="#fff" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><text x="302" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1f2937">the</text><line x1="302" y1="38" x2="302" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="338" y="14" width="56" height="24" rx="4" fill="#fde68a" fill-opacity="1.0" stroke="#b45309" stroke-width="1.5"/><text x="366" y="30" font-family="ui-monospace, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">[MASK]</text><line x1="366" y1="38" x2="366" y2="60" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/><rect x="14" y="60" width="372" height="36" rx="6" fill="#4a5fc1" fill-opacity="0.18" stroke="#4a5fc1" stroke-width="2"/><text x="200" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">Transformer encoder</text><text x="200" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">every word sees the words on both sides</text><line x1="110" y1="96" x2="110" y2="112" stroke="#4a5fc1" stroke-width="1.8" marker-end="url(#a)"/><rect x="82" y="112" width="56" height="22" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="110" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#047857">cat</text><line x1="366" y1="96" x2="366" y2="112" stroke="#4a5fc1" stroke-width="1.8" marker-end="url(#a)"/><rect x="338" y="112" width="56" height="22" rx="4" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="366" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#047857">mat</text><text x="238" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">predict the hidden words</text><rect x="12" y="152" width="212" height="26" rx="6" fill="#4a5fc1" fill-opacity="0.1" stroke="#4a5fc1" stroke-width="1.5"/><text x="118" y="169" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">1. pretrain: fill in blanks, no labels</text><line x1="224" y1="165" x2="246" y2="165" stroke="#4a5fc1" stroke-width="1.8" marker-end="url(#a)"/><rect x="246" y="152" width="142" height="26" rx="6" fill="#ecfdf5" fill-opacity="1.0" stroke="#047857" stroke-width="1.5"/><text x="317" y="169" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#1f2937">2. fine-tune on a few</text><text x="200" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4a5fc1">learn the language once, adapt it to any task cheaply</text></svg>

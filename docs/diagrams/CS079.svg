<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img"><title>SWE-bench</title><desc>A pipeline from real issue to patch to tests, and the small share of issues the best model resolved at the time.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#4b5563"/></marker></defs><rect x="8" y="28" width="82" height="56" rx="6" fill="#fff" fill-opacity="1" stroke="#3f8f6b" stroke-width="1.6"/><text x="49" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">GitHub issue</text><text x="49" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">and the repository</text><line x1="90" y1="56" x2="108" y2="56" stroke="#3f8f6b" stroke-width="2" marker-end="url(#a)"/><rect x="108" y="28" width="82" height="56" rx="6" fill="#fff" fill-opacity="1" stroke="#3f8f6b" stroke-width="1.6"/><text x="149" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">model writes</text><text x="149" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">a patch</text><line x1="190" y1="56" x2="208" y2="56" stroke="#3f8f6b" stroke-width="2" marker-end="url(#a)"/><rect x="208" y="28" width="82" height="56" rx="6" fill="#fff" fill-opacity="1" stroke="#3f8f6b" stroke-width="1.6"/><text x="249" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">run the tests</text><text x="249" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">of the project</text><line x1="290" y1="56" x2="308" y2="56" stroke="#3f8f6b" stroke-width="2" marker-end="url(#a)"/><rect x="308" y="28" width="84" height="56" rx="6" fill="#3f8f6b" fill-opacity="0.16" stroke="#3f8f6b" stroke-width="2"/><text x="350" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1f2937">resolved?</text><text x="350" y="67" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#6b7280">✓ if tests pass</text><text x="200" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">real work from open-source Python projects</text><text x="200" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">2,294 real issues from 12 projects</text><rect x="40" y="130" width="320" height="18" rx="3" fill="#f3f4f6" fill-opacity="1.0" stroke="#4b5563" stroke-width="1.5"/><rect x="40" y="130" width="6" height="18" rx="2" fill="#3f8f6b" fill-opacity="1.0" stroke="#3f8f6b" stroke-width="1.5"/><text x="54" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#3f8f6b">1.96%</text><text x="354" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="normal" text-anchor="end" fill="#6b7280">100%</text><text x="200" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#6b7280">the best model at the time resolved under 2%</text><text x="200" y="199" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#3f8f6b">can a model do an engineer’s job, not just write a function?</text></svg>

<script type="module">
import { makeXScale, stackNodes, computeLayout, radiusFor, ROW_H, X_SEGMENTS, estimateTextWidth } from '../js/layout.js';
import { chooseLabels, basePriority, withFirst, SIDES } from '../js/labels.js';
import { withStubs, STUB_COUNT } from './stub-data.js';
import { validateData, wordCount, requiredFiles } from '../js/validate.js';
import { resolveTheme, createThemeToggle, safeStorage } from '../js/theme.js';
import { run as tmRun, validate as tmValidate, inputs as tmInputs } from '../js/widgets/models/turing.js';
import * as church from '../js/widgets/models/church.js';
import * as dijkstra from '../js/widgets/models/dijkstra.js';
import * as quicksort from '../js/widgets/models/quicksort.js';
import * as shannon from '../js/widgets/models/shannon.js';
import * as amdahl from '../js/widgets/models/amdahl.js';
import * as brooks from '../js/widgets/models/brooks.js';
import * as privacy from '../js/widgets/models/privacy.js';
import { createStepperState } from '../js/widgets/stepper-state.js';
import { WIDGET_TYPE_NAMES } from '../js/widgets/types.js';
import { setTimer, clearTimer, widgetStats } from '../js/widgets/registry.js';
import { buildIndex, ancestors, descendants, rivals } from '../js/traverse.js';

const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, msg: e.message }); }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
const setEq = (s, arr) => s.size === arr.length && arr.every((x) => s.has(x));

/* ---------- makeXScale ---------- */
const SEGS = [{ from: 1908, to: 1930, px: 100 }, { from: 1930, to: 2030, px: 2000 }];
test('xScale: origin and end', () => {
  const x = makeXScale(SEGS, 130);
  assert(x(1908) === 130 && x(2030) === 2230 && x.end === 2230 && x.width === 2100);
});
test('xScale: continuous at the segment boundary', () => {
  const x = makeXScale(SEGS, 0);
  assert(Math.abs(x(1930) - 100) < 1e-9);
  assert(Math.abs(x(1930.0001) - x(1930)) < 0.01);
});
test('xScale: strictly increasing, compressed before 1930', () => {
  const x = makeXScale(SEGS, 0);
  for (let y = 1909; y <= 2030; y++) assert(x(y) > x(y - 1), `not increasing at ${y}`);
  assert(x(1930) - x(1920) < x(1940) - x(1930), 'early segment should be compressed');
});
test('xScale: clamps outside domain', () => {
  const x = makeXScale(SEGS, 0);
  assert(x(1800) === 0 && x(2100) === 2100);
});
test('xScale: rejects gaps and empty input', () => {
  let threw = 0;
  try { makeXScale([]); } catch { threw++; }
  try { makeXScale([{ from: 0, to: 10, px: 10 }, { from: 11, to: 20, px: 10 }]); } catch { threw++; }
  assert(threw === 2);
});

/* ---------- stackNodes ---------- */
const N = (id, x, w = 50, r = 6) => ({ id, x, r, labelW: w });
test('stack: far-apart nodes share row 0', () => {
  const { rowOf, rows } = stackNodes([N('a', 0), N('b', 500)]);
  assert(rows === 1 && rowOf.get('a') === 0 && rowOf.get('b') === 0);
});
test('stack: colliding labels go to separate rows', () => {
  const { rowOf, rows } = stackNodes([N('a', 0), N('b', 20), N('c', 40)]);
  assert(rows === 3 && new Set([...rowOf.values()]).size === 3);
});
test('stack: reuses a freed row', () => {
  const { rowOf, rows } = stackNodes([N('a', 0), N('b', 20), N('c', 400)]);
  assert(rows === 2 && rowOf.get('c') === 0);
});
test('stack: deterministic regardless of input order', () => {
  const nodes = [N('a', 0), N('b', 0), N('c', 20), N('d', 25)];
  const r1 = stackNodes(nodes).rowOf, r2 = stackNodes([...nodes].reverse()).rowOf;
  assert(nodes.every((n) => r1.get(n.id) === r2.get(n.id)));
});
test('stack: same-x nodes never share a row', () => {
  const { rowOf } = stackNodes([N('a', 100), N('b', 100)]);
  assert(rowOf.get('a') !== rowOf.get('b'));
});

/* ---------- computeLayout ---------- */
test('layout: unknown lane is an error', () => {
  let threw = false;
  try {
    computeLayout({ nodes: [{ id: 'x', year: 1950, lane: 'nope', label: 'x', impact: 2 }],
      lanes: [{ id: 'a', label: 'A', color: '#000' }], xScale: makeXScale(SEGS) });
  } catch { threw = true; }
  assert(threw);
});
test('layout: lanes tile the height without gaps', () => {
  const lanes = [{ id: 'a' }, { id: 'b' }];
  const L = computeLayout({
    nodes: [{ id: '1', year: 1950, lane: 'a', label: 'aaaa', impact: 3 }, { id: '2', year: 1950, lane: 'a', label: 'bbbb', impact: 3 }],
    lanes, xScale: makeXScale(SEGS),
  });
  assert(L.lanes[0].y0 === 0 && L.lanes[1].y0 === L.lanes[0].h && L.height === L.lanes[0].h + L.lanes[1].h);
  assert(L.lanes[0].rows === 2 && L.lanes[1].rows === 1);
  const ys = L.nodes.map((n) => n.y);
  assert(Math.abs(ys[0] - ys[1]) === ROW_H, 'stacked nodes are one row apart');
});
test('layout: radius grows with impact', () => assert(radiusFor(3) > radiusFor(2)));

/* ---------- traverse ---------- */
// a -> b -> d ; a -> c -> d ; d -> e ; x -> y (separate) ; b ~rival~ c
const EDGES = [
  { from: 'a', to: 'b', type: 'builds_on' }, { from: 'b', to: 'd', type: 'builds_on' },
  { from: 'a', to: 'c', type: 'builds_on' }, { from: 'c', to: 'd', type: 'generalizes' },
  { from: 'd', to: 'e', type: 'new_domain' }, { from: 'x', to: 'y', type: 'builds_on' },
  { from: 'b', to: 'c', type: 'rival' },
];
test('traverse: ancestors (diamond)', () => {
  const ix = buildIndex(EDGES);
  assert(setEq(ancestors(ix, 'd'), ['a', 'b', 'c']));
  assert(setEq(ancestors(ix, 'a'), []));
});
test('traverse: descendants (diamond)', () => {
  const ix = buildIndex(EDGES);
  assert(setEq(descendants(ix, 'a'), ['b', 'c', 'd', 'e']));
  assert(setEq(descendants(ix, 'e'), []));
});
test('traverse: unrelated components stay separate', () => {
  const ix = buildIndex(EDGES);
  assert(setEq(descendants(ix, 'x'), ['y']) && setEq(ancestors(ix, 'e'), ['a', 'b', 'c', 'd']));
});
test('traverse: rival edges excluded from lineage by default', () => {
  const ix = buildIndex(EDGES);
  assert(!ancestors(ix, 'c').has('b'));
  const ixR = buildIndex(EDGES, { includeRival: true });
  assert(ancestors(ixR, 'c').has('b'));
});
test('traverse: rivals() finds direct rival neighbours both ways', () => {
  assert(setEq(rivals(EDGES, 'b'), ['c']) && setEq(rivals(EDGES, 'c'), ['b']) && rivals(EDGES, 'a').size === 0);
});
test('traverse: cycle does not hang and excludes the start node', () => {
  const ix = buildIndex([{ from: 'p', to: 'q', type: 'builds_on' }, { from: 'q', to: 'p', type: 'builds_on' }]);
  assert(setEq(ancestors(ix, 'p'), ['q']) && setEq(descendants(ix, 'p'), ['q']));
});
test('traverse: unknown id gives empty sets', () => {
  const ix = buildIndex(EDGES);
  assert(ancestors(ix, 'zzz').size === 0 && descendants(ix, 'zzz').size === 0);
});

/* ---------- theme ---------- */
const fakeMedia = (matches) => {
  const m = { matches, listeners: new Set(),
    addEventListener(_, fn) { m.listeners.add(fn); }, removeEventListener(_, fn) { m.listeners.delete(fn); },
    set(v) { m.matches = v; [...m.listeners].forEach((fn) => fn({ matches: v })); } };
  return m;
};
const fakeStorage = (initial = null) => { const s = { v: initial, get: () => s.v, set: (x) => { s.v = x; } }; return s; };
const mkToggle = ({ stored = null, dark = false } = {}) => {
  const root = document.createElement('div'), button = document.createElement('button');
  const storage = fakeStorage(stored), media = fakeMedia(dark);
  const t = createThemeToggle(button, { root, storage, media });
  return { root, button, storage, media, t };
};

test('theme: resolveTheme prefers a valid saved choice, then the OS, ignoring junk', () => {
  assert(resolveTheme({ stored: 'dark', prefersDark: false }) === 'dark');
  assert(resolveTheme({ stored: 'light', prefersDark: true }) === 'light');
  assert(resolveTheme({ stored: null, prefersDark: true }) === 'dark');
  assert(resolveTheme({ stored: null, prefersDark: false }) === 'light');
  assert(resolveTheme({ stored: 'purple', prefersDark: true }) === 'dark', 'junk falls back to the OS');
  assert(resolveTheme({ stored: undefined, prefersDark: false }) === 'light');
});
test('theme: starts from the OS preference when nothing is saved', () => {
  assert(mkToggle({ dark: true }).root.dataset.theme === 'dark');
  assert(mkToggle({ dark: false }).root.dataset.theme === 'light');
});
test('theme: a saved choice beats the OS preference', () => {
  assert(mkToggle({ stored: 'light', dark: true }).root.dataset.theme === 'light');
  assert(mkToggle({ stored: 'dark', dark: false }).root.dataset.theme === 'dark');
});
test('theme: clicking flips the theme, saves it, and relabels the button to the theme you would get next', () => {
  const { root, button, storage } = mkToggle();
  assert(root.dataset.theme === 'light' && button.getAttribute('aria-label') === 'Switch to dark theme' && button.textContent.includes('Dark'));
  button.click();
  assert(root.dataset.theme === 'dark' && storage.v === 'dark', 'now dark and saved');
  assert(button.getAttribute('aria-label') === 'Switch to light theme' && button.textContent.includes('Light'));
  button.click();
  assert(root.dataset.theme === 'light' && storage.v === 'light');
  assert(button.querySelectorAll('.theme-icon').length === 1, 'icon is replaced, not duplicated');
});
test('theme: follows live OS changes only while the user has not chosen', () => {
  const a = mkToggle({ dark: false }); a.media.set(true);
  assert(a.root.dataset.theme === 'dark', 'follows OS when unsaved');
  const b = mkToggle({ stored: 'light', dark: false }); b.media.set(true);
  assert(b.root.dataset.theme === 'light', 'ignores OS once the user chose');
  const c = mkToggle({ dark: false }); c.button.click(); c.media.set(false);
  assert(c.root.dataset.theme === 'dark', 'a click counts as a choice');
});
test('theme: destroy() removes the click and OS listeners', () => {
  const { root, button, media, t } = mkToggle();
  t.destroy();
  button.click(); media.set(true);
  assert(root.dataset.theme === 'light' && media.listeners.size === 0);
});
test('theme: safeStorage never throws even if localStorage access is blocked', () => {
  const original = Object.getOwnPropertyDescriptor(window, 'localStorage'); // restore exactly this afterwards
  Object.defineProperty(window, 'localStorage', { configurable: true, get() { throw new Error('blocked'); } });
  try {
    const s = safeStorage();
    assert(s.get() === null);
    s.set('dark'); // must not throw
  } finally { Object.defineProperty(window, 'localStorage', original); }
  assert(typeof localStorage === 'object', 'localStorage restored');
});

/* ---------- validator ---------- */
const GOOD_EXPL = () => ({
  problem: 'word '.repeat(80).trim(), insight: 'word '.repeat(100).trim(), analogy: 'word '.repeat(40).trim(),
  unlocked: 'word '.repeat(80).trim(), left_open: 'word '.repeat(60).trim(), diagram: 'diagrams/A.svg', diagram_alt: 'alt',
});
const baseData = () => ({
  papers: [{ id: 'A', year: 1936, primary_field: 'L' }, { id: 'B', year: 1950, primary_field: 'L' }],
  ghosts: [{ id: 'G1', year: 1900, lane: 'L' }],
  lanes: [{ id: 'L' }], eras: [{ id: 'E', start: 1800, end: 2100 }],
  edges: [{ id: 'E1', from: 'A', to: 'B', type: 'builds_on', evidence: 'explicit', why: 'A short reason.' },
          { id: 'E2', from: 'G1', to: 'A', type: 'builds_on', evidence: 'interpretive', why: 'Another reason.' }],
  explanations: { A: GOOD_EXPL() },
});
const statusOf = (res, id) => res.find((r) => r.id === id).status;
const problemsOf = (res, id) => res.find((r) => r.id === id).problems.join(' | ');

test('validate: good data passes every rule (scoped)', () => {
  const res = validateData(baseData());
  assert(res.every((r) => r.status !== 'fail'), res.filter((r) => r.status === 'fail').map((r) => r.id + ': ' + r.problems).join('; '));
});
test('validate: strict mode requires every paper to be authored', () => {
  assert(statusOf(validateData(baseData()), 'R1') === 'warn');
  assert(statusOf(validateData(baseData(), { strict: true }), 'R1') === 'fail');
});
test('validate: R2 catches a missing section, a too-short entry and a missing diagram', () => {
  const d = baseData(); delete d.explanations.A.analogy; d.explanations.A.diagram = '';
  const res = validateData(d);
  assert(statusOf(res, 'R2') === 'fail' && /missing section/.test(problemsOf(res, 'R2')) && /no diagram/.test(problemsOf(res, 'R2')));
  const d2 = baseData(); d2.explanations.A.problem = 'too short';
  assert(/words/.test(problemsOf(validateData(d2), 'R2')));
});
test('validate: R2 warns (not fails) outside the 350-450 target but inside 300-500', () => {
  const d = baseData(); d.explanations.A.problem = 'word '.repeat(40).trim(); // total 320
  assert(statusOf(validateData(d), 'R2') === 'warn');
});
test('validate: R3 flags an authored paper with no edge', () => {
  const d = baseData(); d.edges = [d.edges[1]]; d.explanations.B = GOOD_EXPL(); // B now has no edges
  assert(statusOf(validateData(d), 'R3') === 'fail');
});
test('validate: R4 catches bad type, evidence, empty and overlong why, unknown endpoint, duplicate id', () => {
  const d = baseData();
  d.edges.push({ id: 'E3', from: 'A', to: 'B', type: 'nope', evidence: 'explicit', why: 'x' });
  d.edges.push({ id: 'E4', from: 'A', to: 'B', type: 'builds_on', evidence: 'maybe', why: 'x' });
  d.edges.push({ id: 'E5', from: 'A', to: 'B', type: 'builds_on', evidence: 'explicit', why: '' });
  d.edges.push({ id: 'E6', from: 'A', to: 'B', type: 'builds_on', evidence: 'explicit', why: 'w '.repeat(41) });
  d.edges.push({ id: 'E7', from: 'A', to: 'ZZZ', type: 'builds_on', evidence: 'explicit', why: 'x' });
  d.edges.push({ id: 'E1', from: 'A', to: 'B', type: 'builds_on', evidence: 'explicit', why: 'x' });
  const p = problemsOf(validateData(d), 'R4');
  for (const needle of ['invalid type', 'invalid evidence', 'empty "why"', 'max 40', 'unknown to', 'duplicate edge id']) assert(p.includes(needle), 'missing: ' + needle);
});
test('validate: R4 treats placeholder edges as warnings, and as failures in strict mode', () => {
  const d = baseData(); d.edges.push({ id: 'P01', from: 'A', to: 'B', type: 'builds_on', evidence: 'interpretive', why: '[placeholder] rough' });
  assert(statusOf(validateData(d), 'R4') === 'warn' && statusOf(validateData(d, { strict: true }), 'R4') === 'fail');
});
test('validate: R5 rejects backwards edges but allows near-simultaneous rivals either way round', () => {
  const d = baseData(); d.edges.push({ id: 'E3', from: 'B', to: 'A', type: 'builds_on', evidence: 'explicit', why: 'backwards' });
  assert(statusOf(validateData(d), 'R5') === 'fail');
  const near = baseData(); near.papers[1].year = 1937; // A 1936, B 1937
  near.edges.push({ id: 'E3', from: 'B', to: 'A', type: 'rival', evidence: 'explicit', why: 'independent' });
  assert(statusOf(validateData(near), 'R5') === 'pass', 'near rival backwards is allowed');
  const far = baseData(); far.edges.push({ id: 'E3', from: 'B', to: 'A', type: 'rival', evidence: 'explicit', why: 'far apart' });
  assert(statusOf(validateData(far), 'R5') === 'fail', 'far rival backwards is not');
  const fwd = baseData(); fwd.edges.push({ id: 'E3', from: 'A', to: 'B', type: 'rival', evidence: 'interpretive', why: 'forward rival, years apart' });
  assert(statusOf(validateData(fwd), 'R5') === 'pass', 'a rival that goes forward in time is fine however far apart');
});
test('validate: R6 rejects a ghost as an edge target', () => {
  const d = baseData(); d.edges.push({ id: 'E3', from: 'A', to: 'G1', type: 'builds_on', evidence: 'explicit', why: 'x' });
  assert(statusOf(validateData(d), 'R6') === 'fail');
});
test('validate: R8 catches duplicate ids, unknown lanes and a paper outside every era', () => {
  const d = baseData(); d.papers.push({ id: 'A', year: 1936, primary_field: 'L' }); d.papers[1].primary_field = 'X'; d.eras = [{ id: 'E', start: 1940, end: 1960 }];
  const p = problemsOf(validateData(d), 'R8');
  assert(p.includes('duplicate paper id A') && p.includes('unknown lane') && p.includes('0 eras'));
});
test('validate: R9 detects a lineage cycle but ignores rival edges', () => {
  const d = baseData(); d.papers[1].year = 1936;
  d.edges.push({ id: 'E3', from: 'B', to: 'A', type: 'builds_on', evidence: 'explicit', why: 'cycle' });
  assert(statusOf(validateData(d), 'R9') === 'fail');
  const r = baseData(); r.papers[1].year = 1936; r.edges.push({ id: 'E3', from: 'B', to: 'A', type: 'rival', evidence: 'explicit', why: 'rival' });
  assert(statusOf(validateData(r), 'R9') === 'pass');
});
test('validate: wordCount and requiredFiles', () => {
  assert(wordCount('  a  b\nc ') === 3 && wordCount('') === 0 && wordCount(null) === 0);
  const f = requiredFiles({ explanations: { A: { diagram: 'diagrams/A.svg', widget: { config: 'widgets/a.json' } }, B: {} } });
  assert(f.length === 2 && f[0].path === 'diagrams/A.svg');
});

/* ---------- widgets: Turing model, stepper state, registry, validator ---------- */
const TM = await fetch('../widgets/turing.json').then((r) => r.json());
const bin = (n) => n.toString(2);

test('widgets: the Turing config is well formed (a rule for every case, a halt state)', () => {
  assert(TM.model === 'turing' && typeof TM.caption === 'string' && TM.caption.length > 20);
  assert(TM.rules.length === 3 && TM.haltStates.includes('halt'));
  for (const sym of ['0', '1', TM.blank]) assert(TM.rules.some((r) => r.state === TM.initialState && r.read === sym), `no rule for ${sym}`);
  const states = new Set([TM.initialState, ...TM.haltStates]);
  assert(TM.rules.every((r) => states.has(r.next)), 'every rule leads to a known state');
});
test('widgets: the Turing machine adds 1 to every number from 0 to 255 (exhaustive)', () => {
  for (let n = 0; n <= 255; n++) {
    const r = tmRun(TM, bin(n));
    assert(r.halted && !r.stuck && !r.truncated, `${bin(n)} did not halt cleanly`);
    assert(r.output === bin(n + 1), `${bin(n)} -> ${r.output}, want ${bin(n + 1)}`);
  }
});
test('widgets: leading zeros are kept, and all-ones grows the tape to the left', () => {
  assert(tmRun(TM, '0011').output === '0100');
  const r = tmRun(TM, '111');
  assert(r.output === '1000' && r.frames.at(-1).tape.has(-1), 'a new cell appears left of the input');
});
test('widgets: frames start at the rightmost digit and each step changes at most one cell and moves at most one place', () => {
  const r = tmRun(TM, '1011');
  const f0 = r.frames[0];
  assert(f0.step === 0 && f0.head === 3 && f0.state === 'carry' && f0.rule === null);
  for (let i = 1; i < r.frames.length; i++) {
    const a = r.frames[i - 1], b = r.frames[i];
    const changed = [...new Set([...a.tape.keys(), ...b.tape.keys()])].filter((k) => (a.tape.get(k) ?? '_') !== (b.tape.get(k) ?? '_'));
    assert(changed.length <= 1, `step ${i} changed ${changed.length} cells`);
    assert(Math.abs(b.head - a.head) <= 1 && b.step === a.step + 1 && b.rule !== null);
  }
  assert(r.frames.length === 4, 'adding 1 to 1011 takes 3 steps (4 frames)');
});
test('widgets: the display window covers every visited cell and is at least 9 cells wide', () => {
  for (const s of ['0', '1', '111', '10110111']) {
    const r = tmRun(TM, s);
    assert(r.hi - r.lo + 1 >= 9, `${s}: window too small`);
    for (const f of r.frames) assert(f.head >= r.lo && f.head <= r.hi && [...f.tape.keys()].every((k) => k >= r.lo && k <= r.hi), `${s}: cell outside window`);
  }
});
test('widgets: a machine with a missing rule is reported as stuck, not as halted', () => {
  const broken = { ...TM, rules: TM.rules.filter((r) => !(r.read === '0')) };
  const r = tmRun(broken, '10');
  assert(r.stuck && !r.halted && /No rule applies/.test(r.frames.at(-1).note));
});
test('widgets: a machine that never halts is cut off at maxSteps instead of hanging', () => {
  const loop = { ...TM, maxSteps: 20, rules: [{ state: 'carry', read: '1', write: '1', move: 'R', next: 'carry' }, { state: 'carry', read: '_', write: '1', move: 'R', next: 'carry' }] };
  const r = tmRun(loop, '1');
  assert(r.truncated && !r.halted && r.frames.length <= 22 && /Stopped after 20 steps/.test(r.frames.at(-1).note));
});
test('widgets: input validation rejects empty, non-binary and over-long input', () => {
  assert(tmValidate({ tape: '1011' }, TM) === null && tmValidate({ tape: '0' }, TM) === null);
  assert(tmValidate({ tape: '' }, TM) && tmValidate({ tape: '   ' }, TM));
  assert(tmValidate({ tape: 'abc' }, TM) && tmValidate({ tape: '102' }, TM) && tmValidate({ tape: '1 0' }, TM));
  assert(tmValidate({ tape: '123456789' }, TM) === 'Use only the digits 0 and 1.', 'digits checked before length');
  assert(tmValidate({ tape: '111111111' }, TM) === 'Use at most 8 digits.');
  assert(tmInputs(TM)[0].value === TM.input && tmInputs(TM)[0].maxLength === 8);
});
test('widgets: hostile input text is rejected by validation, so it can never reach the page', () => {
  for (const s of ['<img src=x onerror=1>', '1011<script>', '"><b>', '1\n0']) assert(tmValidate({ tape: s }, TM) !== null, s);
});
test('widgets: stepper state stays within bounds and resets', () => {
  const s = createStepperState(3);
  assert(s.index === 0 && s.atStart && !s.atEnd && s.count === 3);
  assert(s.back() === false && s.index === 0, 'cannot go before the start');
  assert(s.next() && s.next() && s.index === 2 && s.atEnd);
  assert(s.next() === false && s.index === 2, 'cannot go past the end');
  assert(s.back() && s.index === 1);
  s.reset(); assert(s.index === 0);
  s.next(); s.setCount(5); assert(s.count === 5 && s.index === 0, 'setCount returns to the start');
  assert(createStepperState(0).count === 1 && createStepperState(1).atEnd && createStepperState(1).atStart, 'a single frame is both start and end');
});
test('widgets: the registry counts timers and they return to zero when cleared or fired', async () => {
  const before = widgetStats().timers;
  const a = setTimer(() => {}, 10000), b = setTimer(() => {}, 10000);
  assert(widgetStats().timers === before + 2);
  clearTimer(a); clearTimer(a); // clearing twice is harmless
  assert(widgetStats().timers === before + 1);
  clearTimer(b);
  assert(widgetStats().timers === before);
  let fired = 0; setTimer(() => { fired++; }, 5);

/* ---------- chooseLabels: which node labels get drawn ---------- */
const LN = (id, x, y, labelW = 60, r = 6) => ({ id, x, y, r, labelW });
const V = { k: 1, tx: 0, ty: 0, viewW: 800, viewH: 400 };
const choose = (nodes, order, extra = {}) => chooseLabels({ nodes, order, ...V, ...extra });
// The rectangle a returned label occupies, worked out here from its anchor, not taken from the module.
const labelRect = (l, h = 14) => ({
  x0: l.anchor === 'start' ? l.x : l.anchor === 'end' ? l.x - l.w : l.x - l.w / 2,
  x1: l.anchor === 'start' ? l.x + l.w : l.anchor === 'end' ? l.x : l.x + l.w / 2,
  y0: l.y - h / 2, y1: l.y + h / 2,
});

test('labels: the candidate sides are fixed: beside the dot first, then on top, then under', () => {
  assert(SIDES.join() === 'right,left,above,below');
});
test('labels: when two labels collide the higher-priority one is drawn and the other is hidden (and the order decides)', () => {
  const nodes = [LN('a', 100, 100), LN('b', 100, 112)]; // labels overlap by 2px; neither dot is in the other's way
  const ab = choose(nodes, ['a', 'b'], { sides: ['right'] }), ba = choose(nodes, ['b', 'a'], { sides: ['right'] });
  assert(ab.has('a') && !ab.has('b'), 'a first: a wins');
  assert(ba.has('b') && !ba.has('a'), 'b first: b wins');
});
test('labels: a label never covers another node\u2019s dot, so it moves to the next side, and is hidden when none is free', () => {
  const me = LN('me', 100, 100);
  const dot = (id, x, y) => LN(id, x, y, 0, 6);
  const right = choose([me, dot('r', 130, 100)], ['me']).get('me');
  assert(right.side === 'left' && right.anchor === 'end' && right.x === 90, `right blocked -> left: ${JSON.stringify(right)}`);
  const above = choose([me, dot('r', 130, 100), dot('l', 60, 100)], ['me']).get('me');
  assert(above.side === 'above' && above.anchor === 'middle' && above.x === 100 && above.y === 85, `-> above: ${JSON.stringify(above)}`);
  const below = choose([me, dot('r', 130, 100), dot('l', 60, 100), dot('u', 100, 85)], ['me']).get('me');
  assert(below.side === 'below' && below.y === 115, `-> below: ${JSON.stringify(below)}`);
  assert(!choose([me, dot('r', 130, 100), dot('l', 60, 100), dot('u', 100, 85), dot('d', 100, 115)], ['me']).has('me'), 'nowhere to go: hidden');
});
test('labels: a forced label (hovered or selected node) is drawn even when every side is blocked by other dots, but only as a last resort', () => {
  const me = LN('me', 100, 100);

  const boxed = [me, dot('r', 130, 100), dot('l', 60, 100), dot('u', 100, 85), dot('d', 100, 115)];
  assert(!choose(boxed, ['me']).has('me'), 'not forced: hidden');
  const f = choose(boxed, ['me'], { force: ['me'] }).get('me');
  assert(f && f.side === 'right', `forced: first side inside the view is used: ${JSON.stringify(f)}`);
  const free = choose([me, dot('r', 130, 100)], ['me'], { force: ['me'] }).get('me');

});
test('labels: a node\u2019s own dot never blocks its own label, and an unobstructed label goes to the right', () => {

test('labels: nothing is drawn left of minX (where the lane names sit) or past the right edge', () => {

test('labels: zooming in spreads a crowded row apart, so more of it gets a label', () => {
  const row = Array.from({ length: 8 }, (_, i) => LN(`n${i}`, 100 + i * 30, 100, 40));
  const order = row.map((n) => n.id);
  const n = (k) => chooseLabels({ nodes: row, order, k, tx: 0, ty: 0, viewW: 1200, viewH: 400, sides: ['right'] }).size;
  // The dots grow with the zoom too, so a label has to clear its neighbour's dot: it only opens up at 3x here.

  assert(a === b, 'same order of priorities gives the same labels, whatever order the nodes are listed in');

test('labels: property check: over random layouts, zooms and priorities no label overlaps another label, covers a dot, or leaves the margins', () => {
  let seed = 99; const rnd = (n) => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; };
  let drawn = 0;
  for (let trial = 0; trial < 60; trial++) {
    const nodes = Array.from({ length: 70 }, (_, i) => LN(`n${i}`, rnd(1600), rnd(800), 30 + rnd(90), 6 + 3 * rnd(2)));
    const order = nodes.map((x) => x.id).sort(() => rnd(3) - 1);
    const k = [0.3, 0.55, 1, 1.8, 3][rnd(5)], tx = -rnd(500), ty = -rnd(200), minX = rnd(2) ? 112 : 0;
    const out = chooseLabels({ nodes, order, k, tx, ty, viewW: 900, viewH: 500, minX });
    const rects = [...out].map(([id, l]) => ({ id, ...labelRect(l) }));
    drawn += rects.length;
    for (const a of rects) {
      assert(a.x0 >= minX && a.x1 <= 900, `trial ${trial}: ${a.id} outside the margins`);
      for (const n of nodes) {
        if (n.id === a.id) continue;
        const sx = n.x * k + tx, sy = n.y * k + ty, r = n.r * k;
        assert(!(a.x0 < sx + r && sx - r < a.x1 && a.y0 < sy + r && sy - r < a.y1), `trial ${trial}: label ${a.id} covers the dot of ${n.id}`);
      }
      for (const b of rects) if (a.id < b.id) assert(!(a.x0 < b.x1 + 3 && b.x0 < a.x1 + 3 && a.y0 < b.y1 + 3 && b.y0 < a.y1 + 3), `trial ${trial}: labels ${a.id} and ${b.id} overlap`);
    }
  }
  assert(drawn > 300, `the property check actually drew labels (${drawn})`);
});
test('labels: priority is impact first, then number of links, outside influences last, then id; withFirst moves ids to the front without duplicates', () => {
  const nodes = [{ id: 'a', impact: 2 }, { id: 'b', impact: 3 }, { id: 'c', impact: 3 }, { id: 'g', impact: 3, ghost: true }, { id: 'd', impact: 3 }];

const CH = await fetch('../widgets/church.json').then((r) => r.json());

/* ---------- widgets: Dijkstra ---------- */
const DJ = await fetch('../widgets/dijkstra.json').then((r) => r.json());
function floyd(nodes, edges) {
  const ids = nodes.map((n) => n.id), d = {};
  for (const a of ids) { d[a] = {}; for (const b of ids) d[a][b] = a === b ? 0 : Infinity; }
  for (const e of edges) { d[e.a][e.b] = Math.min(d[e.a][e.b], e.w); d[e.b][e.a] = Math.min(d[e.b][e.a], e.w); }
  for (const k of ids) for (const i of ids) for (const j of ids) if (d[i][k] + d[k][j] < d[i][j]) d[i][j] = d[i][k] + d[k][j];
  return d;
}
test('widgets: the Dijkstra config is well formed (unique nodes, valid edges, everything inside the drawing)', () => {
  assert(DJ.model === 'dijkstra' && DJ.caption.length > 40 && DJ.nodes.length === 6 && DJ.edges.length === 9);
  const ids = DJ.nodes.map((n) => n.id);
  assert(new Set(ids).size === ids.length && ids.every((i) => /^[A-Z]$/.test(i)) && ids.includes(DJ.source));
  assert(DJ.edges.every((e) => ids.includes(e.a) && ids.includes(e.b) && e.a !== e.b && Number.isInteger(e.w) && e.w > 0));
  assert(DJ.nodes.every((n) => n.x >= 20 && n.x <= 380 && n.y >= 20 && n.y <= 150), 'inside the 400x190 drawing with room for labels');
});
test('widgets: from every start node the distances match an independent all-pairs computation', () => {
  const want = floyd(DJ.nodes, DJ.edges);
  for (const s of DJ.nodes.map((n) => n.id)) {
    const r = dijkstra.shortestPaths(DJ.nodes, DJ.edges, s);
    for (const t of Object.keys(want[s])) assert(r.dist[t] === want[s][t], `${s}->${t}: ${r.dist[t]} vs ${want[s][t]}`);
  }
  const a = dijkstra.shortestPaths(DJ.nodes, DJ.edges, 'A');
  assert(JSON.stringify(a.dist) === '{"A":0,"B":3,"C":2,"D":8,"E":10,"F":13}', 'hand-computed distances from A');
  assert(a.order.join('') === 'ACBDEF', 'settled in order of distance');
  assert(dijkstra.pathTo(a, 'F').join('>') === 'A>C>B>D>E>F', 'hand-traced route to F: 2+1+5+2+3 = 13');
});
test('widgets: random graphs agree with the independent computation (300 graphs, including unreachable nodes)', () => {
  let seed = 12345;
  const rnd = (n) => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; };
  for (let g = 0; g < 300; g++) {
    const n = 2 + rnd(6), nodes = Array.from({ length: n }, (_, i) => ({ id: String.fromCharCode(65 + i) }));
    const edges = [];
    for (let k = rnd(n * 2); k > 0; k--) { const a = rnd(n), b = rnd(n); if (a !== b) edges.push({ a: nodes[a].id, b: nodes[b].id, w: rnd(9) }); }
    const want = floyd(nodes, edges), s = nodes[rnd(n)].id;
    const r = dijkstra.shortestPaths(nodes, edges, s);
    for (const t of nodes) assert(r.dist[t.id] === want[s][t.id], `graph ${g}: ${s}->${t.id} ${r.dist[t.id]} vs ${want[s][t.id]}`);
  }
});
test('widgets: Dijkstra frames only ever improve, settle in non-decreasing order, and end with everything reachable settled', () => {
  const r = dijkstra.shortestPaths(DJ.nodes, DJ.edges, 'A');
  const f0 = r.frames[0];
  assert(f0.dist.A === 0 && Object.values(f0.dist).filter((x) => x === Infinity).length === 5 && f0.done.length === 0 && f0.edge === null);
  for (let i = 1; i < r.frames.length; i++) {
    const a = r.frames[i - 1], b = r.frames[i];
    for (const k of Object.keys(b.dist)) assert(b.dist[k] <= a.dist[k], `frame ${i}: ${k} got worse`);
    assert(b.done.length >= a.done.length && a.done.every((x) => b.done.includes(x)), 'settled nodes stay settled');
    if (b.improved) assert(b.dist[b.improved] < a.dist[b.improved] && b.prev[b.improved] === b.current, `frame ${i}: improvement is recorded`);
    else for (const k of Object.keys(b.dist)) assert(b.dist[k] === a.dist[k], `frame ${i}: no improvement, no change`);
    if (b.edge) assert(b.edge.a === b.current && !b.done.includes(b.edge.b), 'an edge is only examined from the node being settled, to an unsettled one');
  }
  const order = r.frames.at(-1).done.map((id) => r.dist[id]);
  assert(order.every((d, i) => i === 0 || d >= order[i - 1]), 'settled in non-decreasing distance');
  assert(r.frames.at(-1).done.length === 6 && /Done\./.test(r.frames.at(-1).note) && r.frames.length === 17);
  assert(r.frames.some((f) => /Update B to 3, reached via C/.test(f.note)), 'B improves from 4 to 3 through C');
  const fromD = dijkstra.shortestPaths(DJ.nodes, DJ.edges, 'D');
  assert(fromD.frames.some((f) => /not shorter/.test(f.note)) && fromD.frames.some((f) => f.improved), 'from D, both kinds of edge check appear');
});
test('widgets: a node that cannot be reached stays at infinity, is reported, and nothing hangs', () => {
  const nodes = [{ id: 'A' }, { id: 'B' }, { id: 'C' }], edges = [{ a: 'A', b: 'B', w: 2 }];
  const r = dijkstra.shortestPaths(nodes, edges, 'A');
  assert(r.dist.C === Infinity && dijkstra.pathTo(r, 'C') === null && /C cannot be reached/.test(r.frames.at(-1).note));
  assert(dijkstra.pathTo(r, 'B').join('') === 'AB');
  const z = dijkstra.shortestPaths(nodes, [{ a: 'A', b: 'B', w: 0 }, { a: 'B', b: 'C', w: 0 }], 'A');
  assert(z.dist.C === 0, 'zero-weight edges are fine');
});
test('widgets: Dijkstra input validation accepts either case and rejects everything else', () => {
  const v = (s) => dijkstra.validate({ start: s }, DJ);
  assert(v('A') === null && v('f') === null && v(' c ') === null);
  assert(v('') && v('Z') && v('AB') && v('1') && v('<b>') && v('"'));
  assert(dijkstra.inputs(DJ)[0].value === 'A' && dijkstra.inputs(DJ)[0].maxLength === 1);
  assert(dijkstra.build(DJ, { start: 'f' }).source === 'F', 'lower case is normalised');
});

const QS = await fetch('../widgets/quicksort.json').then((r) => r.json());
test('widgets: the Quicksort config is well formed and its default input is valid', () => {
  assert(QS.model === 'quicksort' && QS.caption.length > 40 && QS.maxCount === 10 && QS.maxValue === 99);

test('widgets: Quicksort sorts every list of 2 to 6 numbers over four values (exhaustive, so duplicates are covered)', () => {
  function* lists(n, k) { if (n === 0) { yield []; return; } for (const rest of lists(n - 1, k)) for (let v = 0; v < k; v++) yield [v, ...rest]; }
  let count = 0;
  for (let n = 2; n <= 6; n++) for (const l of lists(n, 4)) {
    count++;
    const r = quicksort.sortFrames(l);
    assert(r.sorted.join() === [...l].sort((a, b) => a - b).join(), `${l.join()} -> ${r.sorted.join()}`);
    assert(r.frames.at(-1).done.length === n, `${l.join()}: every number is settled at the end`);
  }
  assert(count === 4 ** 2 + 4 ** 3 + 4 ** 4 + 4 ** 5 + 4 ** 6);
});
test('widgets: Quicksort frames: a swap changes exactly the two pointed-at places, everything else is unchanged', () => {
  const r = quicksort.sortFrames([5, 2, 9, 1, 7, 3, 8, 6]);
  const vals = (f) => f.items.map((x) => x.v);
  for (let k = 1; k < r.frames.length; k++) {
    const a = r.frames[k - 1], b = r.frames[k];
    assert([...b.items.map((x) => x.id)].sort((p, q) => p - q).join() === '0,1,2,3,4,5,6,7', 'frame ' + k + ' still has every element once');
    const diff = vals(a).map((v, i) => (v !== vals(b)[i] ? i : -1)).filter((i) => i >= 0);
    if (b.swapped) assert(b.swapped.join() === [b.i, b.j].join() && diff.length === 2 && diff.every((i) => b.swapped.includes(i)), `frame ${k}: swap`);
    else assert(diff.length === 0, `frame ${k}: only swap frames change the order`);
    assert(b.done.length >= a.done.length && a.done.every((x) => b.done.includes(x)), 'settled stays settled');
  }
  assert(r.frames[0].swapped === null && r.frames[0].range === null && r.frames.at(-1).range === null);
  assert(r.frames.length === 28, `8 numbers give 28 frames, got ${r.frames.length}`);
  assert(vals(r.frames[3]).join() === '3,2,9,1,7,5,8,6', 'the first swap exchanges 5 and 3 (hand-computed)');
});
test('widgets: Quicksort pointers stay inside the range, and a split always leaves both sides non-empty', () => {

test('shannon: entropy of known distributions, and the binary channel', () => {
  assert(shannon.entropy([0.25, 0.25, 0.25, 0.25]) === 2 && shannon.entropy([1, 0, 0, 0]) === 0 && Object.is(shannon.entropy([1, 0, 0, 0]), 0), 'uniform 2 bits, certain 0 bits (and not -0)');
  assert(shannon.entropy([0.5, 0.25, 0.125, 0.125]) === 1.75, 'a dyadic distribution has an exact entropy');
  assert(shannon.binaryEntropy(0.5) === 1 && shannon.binaryEntropy(0) === 0 && shannon.binaryEntropy(1) === 0);
  assert(shannon.channelCapacity(0) === 1 && shannon.channelCapacity(0.5) === 0 && Math.abs(shannon.channelCapacity(0.11) - 0.5) < 0.001, 'perfect channel 1, coin-flip channel 0, 11% flips about 0.5');
  for (let f = 0.01; f < 0.5; f += 0.01) {
    assert(Math.abs(shannon.channelCapacity(f) - shannon.channelCapacity(1 - f)) < 1e-12, `symmetric at ${f}`);
    assert(shannon.channelCapacity(f) < shannon.channelCapacity(f - 0.01) + 1e-12, `capacity falls as noise grows (${f})`);
  }
});
test('shannon: for every weighting of four symbols (2400 of them) Huffman’s code is prefix-free, fills the code space and averages within one bit of the entropy', () => {
  let checked = 0;
  for (let a = 0; a <= 6; a++) for (let b = 0; b <= 6; b++) for (let c = 0; c <= 6; c++) for (let d = 0; d <= 6; d++) {
    const t = a + b + c + d; if (!t) continue;
    checked++;
    const p = [a, b, c, d].map((x) => x / t), H = shannon.entropy(p), L = shannon.huffmanLengths(p), avg = shannon.averageLength(p, L);
    assert(avg >= H - 1e-9 && avg < H + 1, `[${a},${b},${c},${d}]: H ${H} avg ${avg}`);
    const used = L.filter((l, i) => p[i] > 0 && l > 0);
    if (used.length > 1) assert(Math.abs(used.reduce((s, l) => s + 2 ** -l, 0) - 1) < 1e-9, `[${a},${b},${c},${d}]: Kraft sum is 1`);
    const codes = shannon.canonicalCodes(L).filter((x) => x);
    assert(new Set(codes).size === codes.length && !codes.some((x) => codes.some((y) => x !== y && y.startsWith(x))), `[${a},${b},${c},${d}]: prefix-free`);
    const all = shannon.canonicalCodes(L);
    assert(p.every((x, i) => (x > 0 || all[i] === '') && (used.length < 2 || x === 0 || all[i] !== '')), `[${a},${b},${c},${d}]: a symbol has a code exactly when it can occur`);
  }
  assert(checked === 7 ** 4 - 1, `checked ${checked}`);
});
test('shannon: the default weighting (4, 2, 1, 1) gives the hand-computed answer, and edge cases are handled in words', () => {
  const s = shannon.compute({ w0: 4, w1: 2, w2: 1, w3: 1, noise: 11 }, SL.shannon);
  assert(s.valid && s.H === 1.75 && s.fixed === 2 && s.lengths.join() === '1,2,3,3' && s.codes.join() === '0,10,110,111' && s.avg === 1.75, JSON.stringify([s.H, s.lengths, s.codes]));
  const scaled = shannon.compute({ w0: 12, w1: 6, w2: 3, w3: 3, noise: 11 }, SL.shannon);
  assert(scaled.H === s.H && scaled.p.join() === s.p.join(), 'only the proportions matter, not the weights');
  const none = shannon.compute({ w0: 0, w1: 0, w2: 0, w3: 0, noise: 0 }, SL.shannon);
  assert(!none.valid && /at least one symbol/.test(none.message) && none.readouts[0].value === '—');
  const one = shannon.compute({ w0: 0, w1: 5, w2: 0, w3: 0, noise: 0 }, SL.shannon);
  assert(one.H === 0 && one.fixed === 0 && /nothing needs to be sent/.test(one.message) && one.avg === 0);
  const uniform = shannon.compute({ w0: 3, w1: 3, w2: 3, w3: 3, noise: 0 }, SL.shannon);
  assert(uniform.H === 2 && uniform.avg === 2 && uniform.capacity === 1 && !/Huffman's code gets/.test(uniform.message), 'when no saving is possible it does not claim one');
});

test('amdahl: the speedup formula, its limits and its shape', () => {
  assert(Math.abs(amdahl.speedup(0.9, 64) - 1 / (0.1 + 0.9 / 64)) < 1e-12 && Math.abs(amdahl.speedup(0.9, 64) - 8.7671) < 1e-3, 'hand-computed 8.767');
  for (const n of [1, 2, 64, 4096]) { assert(amdahl.speedup(0, n) === 1, 'nothing parallel: no speedup'); assert(Math.abs(amdahl.speedup(1, n) - n) < 1e-9, 'all parallel: speedup = processors'); }
  for (const p of [0, 0.5, 0.9, 0.95, 0.99, 1]) {
    assert(amdahl.speedup(p, 1) === 1, `one processor gives no speedup (p=${p})`);
    let prev = 0;
    for (let k = 0; k <= 12; k++) {
      const n = 2 ** k, s = amdahl.speedup(p, n);
      assert(s >= prev - 1e-12, `non-decreasing in N (p=${p}, N=${n})`);
      assert(s <= Math.min(n, amdahl.speedupLimit(p)) + 1e-9, `never beats the number of processors or the ceiling (p=${p}, N=${n})`);
      prev = s;
    }
  }
  assert(Math.abs(amdahl.speedupLimit(0.9) - 10) < 1e-9 && amdahl.speedupLimit(1) === Infinity && Math.abs(amdahl.speedup(0.9, 2 ** 40) - 10) < 1e-6, 'ceiling is 1/(1-p) and is approached');
  const c = amdahl.compute({ parallel: 90, processors: 64 }, SL.amdahl);
  assert(Math.abs(c.efficiency - amdahl.speedup(0.9, 64) / 64) < 1e-12 && c.efficiency > 0 && c.efficiency <= 1 && /more than 10× speedup/.test(c.message), c.message);
  assert(/keeps growing/.test(amdahl.compute({ parallel: 100, processors: 64 }, SL.amdahl).message), 'with nothing serial there is no ceiling');
});

test('brooks: communication paths grow as n(n-1)/2, and finishing time falls then rises', () => {
  assert([1, 2, 3, 8, 40].map(brooks.paths).join() === '0,1,3,28,780', 'hand-computed paths');
  const W = 48, C = 0.2;
  assert(brooks.months(1, W, C) === W, 'one person takes all the work');
  assert(Math.abs(brooks.months(8, W, C) - 6.7) < 1e-12, 'hand-computed 48/8 + 0.2*7/2 = 6.7');
  const ts = Array.from({ length: 40 }, (_, i) => brooks.months(i + 1, W, C));
  const best = brooks.bestTeam(W, C, 40);
  assert(ts.every((t) => t >= ts[best - 1] - 1e-12), 'the best team size is the minimum');
  assert(Math.abs(best - Math.sqrt((2 * W) / C)) <= 1, `close to sqrt(2W/c): ${best} vs ${Math.sqrt((2 * W) / C).toFixed(1)}`);
  for (let i = 1; i < best; i++) assert(ts[i] < ts[i - 1], `falling before the best size (n=${i + 1})`);
  for (let i = best; i < 40; i++) assert(ts[i] > ts[i - 1], `rising after the best size (n=${i + 1})`);
  assert(brooks.bestTeam(W, 0, 40) === 40, 'with free communication more people always help');
  assert(brooks.bestTeam(W, 60, 40) === 1 && brooks.bestTeam(W, 5, 40) > 1, 'one person is fastest only once a single path costs more than all the work');
});
test('brooks: the message says whether you are before, at or past the best team size', () => {
  const m = (team) => brooks.compute({ team, work: 48, cost: 0.2 }, SL.brooks);
  assert(/More people still help/.test(m(8).message) && !m(8).past, 'before');
  assert(/best team size/.test(m(22).message) && !m(22).past, 'at');
  assert(/makes the project later/.test(m(40).message) && m(40).past, 'past');
  assert(m(8).readouts[0].value === '28' && m(8).readouts[1].value === '6.7 months' && m(8).readouts[2].value.startsWith('22 people'));
});

test('privacy: the guarantee. For every epsilon and every answer, adding one person changes the log-probability by at most epsilon (and by exactly that somewhere)', () => {
  for (const eps of SL.privacy.sliders[0].values) {
    const b = 1 / eps; let reached = false;
    for (let x = -100; x <= 180; x += 0.31) {
      const diff = Math.abs(privacy.laplaceLogPdf(x, 40, b) - privacy.laplaceLogPdf(x, 41, b));
      assert(diff <= eps + 1e-9, `eps ${eps}, x ${x}: ${diff} > ${eps}`);
      if (Math.abs(diff - eps) < 1e-9) reached = true;
    }
    assert(reached, `the bound e^${eps} is tight: it is reached for some answer`);
  }
});
test('privacy: the Laplace density integrates to 1, its within-probability matches the integral, and samples have the right size', () => {
  let area = 0, inside = 0; const b = 1.5, k = 2;
  for (let x = -120; x <= 120; x += 0.01) { const d = privacy.laplacePdf(x, 0, b) * 0.01; area += d; if (Math.abs(x) <= k) inside += d; }
  assert(Math.abs(area - 1) < 1e-3, `area ${area}`);
  assert(Math.abs(inside - privacy.withinProbability(k, b)) < 1e-3, `${inside} vs ${privacy.withinProbability(k, b)}`);
  assert(privacy.laplaceSample(0.5, 3) === 0 || Object.is(privacy.laplaceSample(0.5, 3), -0), 'the median sample is 0');
  for (const u of [0.01, 0.2, 0.4, 0.77]) assert(Math.abs(privacy.laplaceSample(u, 2) + privacy.laplaceSample(1 - u, 2)) < 1e-9, 'symmetric about 0');
  const rng = privacy.makeRng(1); let sum = 0, n = 40000;
  for (let i = 0; i < n; i++) sum += Math.abs(privacy.laplaceSample(rng(), 2));
  assert(Math.abs(sum / n - privacy.typicalError(2)) < 0.06, `mean |noise| ${sum / n} vs 2`);
});
test('privacy: the counts the button releases carry noise of size 1/epsilon, for each epsilon (not just in the formulas)', () => {
  for (const eps of [0.2, 1, 5]) {
    const extra = {}; let sum = 0; const n = 20000;
    privacy.compute({ epsilon: eps, tolerance: 5 }, SL.privacy, extra);
    for (let i = 0; i < n; i++) { privacy.act('draw', { epsilon: eps }, SL.privacy, extra); sum += Math.abs(extra.draws.at(-1) - SL.privacy.trueCount); }
    assert(Math.abs(sum / n - 1 / eps) < 0.05 / eps, `epsilon ${eps}: mean error ${(sum / n).toFixed(3)} vs ${1 / eps}`);
  }
});
test('privacy: the random generator is deterministic and in range; draws are kept per epsilon and capped', () => {
  const a = privacy.makeRng(7), b = privacy.makeRng(7), c = privacy.makeRng(8);
  const xs = Array.from({ length: 50 }, () => a()), ys = Array.from({ length: 50 }, () => b());
  assert(xs.join() === ys.join() && xs.every((v) => v >= 0 && v < 1) && c() !== xs[0], 'same seed, same sequence; values in [0, 1)');
  const cfg = SL.privacy, extra = {};
  privacy.compute({ epsilon: 1, tolerance: 5 }, cfg, extra);
  for (let i = 0; i < 15; i++) privacy.act('draw', { epsilon: 1 }, cfg, extra);
  assert(extra.draws.length === 12, 'only the last 12 are kept');
  const again = {}; privacy.compute({ epsilon: 1, tolerance: 5 }, cfg, again); for (let i = 0; i < 15; i++) privacy.act('draw', { epsilon: 1 }, cfg, again);
  assert(again.draws.join() === extra.draws.join(), 'the same clicks give the same answers');
  privacy.compute({ epsilon: 2, tolerance: 5 }, cfg, extra);
  assert(extra.draws.length === 0, 'moving epsilon starts a fresh set of draws');
  const st = privacy.compute({ epsilon: 0.5, tolerance: 5 }, cfg, {});
  assert(st.b === 2 && Math.abs(st.ratio - Math.exp(0.5)) < 1e-12 && st.readouts[0].value === '±2.0' && /Release a noisy count/.test(st.message));
  assert(privacy.actions()[0].id === 'draw');
});

      for (const ns of byRow.values()) { ns.sort((a, b) => a.x - b.x); for (let i = 1; i < ns.length; i++) assert(ns[i - 1].x + ns[i - 1].r + 4 <= ns[i].x - ns[i].r, `dots overlap: ${ns[i - 1].id}/${ns[i].id}`); }

}

/* ---------- report ---------- */
const failed = results.filter((r) => !r.ok);
document.getElementById('summary').textContent =
  `${results.length - failed.length}/${results.length} passed` + (failed.length ? ` — ${failed.length} FAILED` : '');
document.getElementById('summary').className = failed.length ? 'fail' : 'pass';
document.getElementById('results').innerHTML = results
  .map((r) => `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}: ${r.name.replace(/</g, '&lt;')}${r.ok ? '' : ' — ' + String(r.msg).replace(/</g, '&lt;')}</li>`)
  .join('');
document.title = failed.length ? 'FAILED' : 'ALL PASSED';
</script>
</body>
</html>
